<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0e1a" />
<title>MSAFIRI GLOBAL MEDIA</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<!-- ============ SPLASH SCREEN ============ -->
<div id="splashScreen">
  <div class="splash-logo">M</div>
  <div class="splash-title">Msafiri Global Media</div>
  <div class="splash-subtitle">Connect beyond</div>
</div>

<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen" class="screen hidden">
  <div class="auth-logo">
    <div class="auth-logo-mark">M</div>
    <div class="auth-title">MSAFIRI GLOBAL MEDIA</div>
    <div class="auth-subtitle">Connect beyond</div>
  </div>
  <div class="auth-tabs">
    <button class="auth-tab active" data-tab="login">Login</button>
    <button class="auth-tab" data-tab="register">Register</button>
  </div>

  <form id="loginForm" class="auth-form">
    <div id="loginError" class="error-msg hidden"></div>
    <div class="field">
      <label>Email</label>
      <div class="input-wrap">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email" />
      </div>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password" />
        <button type="button" class="password-toggle" data-target="loginPassword">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary" id="loginBtn"><span>Login</span></button>
  </form>

  <form id="registerForm" class="auth-form hidden">
    <div id="registerError" class="error-msg hidden"></div>
    <div class="field">
      <label>Full Name</label>
      <div class="input-wrap">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="regName" placeholder="John Doe" required maxlength="100" />
      </div>
    </div>
    <div class="field">
      <label>Username (optional)</label>
      <div class="input-wrap">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg>
        <input type="text" id="regUsername" placeholder="johndoe" maxlength="30" />
      </div>
    </div>
    <div class="field">
      <label>Email</label>
      <div class="input-wrap">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <input type="email" id="regEmail" placeholder="you@example.com" required autocomplete="email" />
      </div>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="regPassword" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" />
        <button type="button" class="password-toggle" data-target="regPassword">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary" id="registerBtn"><span>Create Account</span></button>
  </form>
</div>

<!-- ============ APP SCREEN ============ -->
<div id="appScreen" class="screen hidden">
  <header class="app-header">
    <h1 id="headerTitle">MSAFIRI</h1>
    <div class="header-actions">
      <button class="btn-icon" id="themeToggle" title="Toggle theme">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="btn-icon" id="threeDotsBtn" title="Menu">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
    </div>
  </header>

  <main class="app-main" id="appMain"></main>

  <nav class="bottom-nav" id="bottomNav">
    <a class="nav-item active" data-view="home">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </a>
    <a class="nav-item" data-view="discovery">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
      <span>Discovery</span>
    </a>
    <a class="nav-item" data-view="chats">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Chats</span>
      <span class="badge hidden" id="chatsBadge">0</span>
    </a>
    <a class="nav-item" data-view="profile">
      <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profile</span>
    </a>
  </nav>
</div>

<div id="modalContainer"></div>
<div class="toast-container" id="toastContainer"></div>

<script src="/static/app.js"></script>

</body>
</html>
