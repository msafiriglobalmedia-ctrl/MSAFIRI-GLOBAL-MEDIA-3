<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0e1a" />
<title>MSAFIRI GLOBAL MEDIA</title>
<style>
/* ============================================================
   RESET & VARIABLES
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0a0e1a;
  --bg-2: #111827;
  --bg-3: #1a2235;
  --bg-hover: #1f2937;
  --border: #1f2937;
  --border-2: #2d3748;
  --text: #f1f5f9;
  --text-2: #94a3b8;
  --text-3: #64748b;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --accent-2: #8b5cf6;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --shadow: 0 4px 12px rgba(0,0,0,0.3);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

[data-theme="light"] {
  --bg: #ffffff;
  --bg-2: #f8fafc;
  --bg-3: #f1f5f9;
  --bg-hover: #e2e8f0;
  --border: #e2e8f0;
  --border-2: #cbd5e1;
  --text: #0f172a;
  --text-2: #475569;
  --text-3: #94a3b8;
  --shadow: 0 4px 12px rgba(0,0,0,0.08);
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  overflow: hidden;
  transition: background 0.3s ease, color 0.3s ease;
}

body { display: flex; flex-direction: column; }

input, textarea, button, select {
  font-family: inherit;
  font-size: inherit;
  outline: none;
  border: none;
  background: none;
  color: inherit;
}

button { cursor: pointer; }
img { max-width: 100%; display: block; }
a { color: var(--accent); text-decoration: none; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

.hidden { display: none !important; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-center { justify-content: center; }
.justify-between { justify-content: space-between; }
.gap-1 { gap: 4px; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }
.flex-1 { flex: 1; }
.w-full { width: 100%; }
.text-center { text-align: center; }
.text-sm { font-size: 13px; }
.text-xs { font-size: 11px; }
.text-lg { font-size: 17px; }
.text-xl { font-size: 20px; }
.text-2xl { font-size: 24px; }
.font-bold { font-weight: 700; }
.font-semi { font-weight: 600; }
.opacity-70 { opacity: 0.7; }
.truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.relative { position: relative; }
.absolute { position: absolute; }
.cursor-pointer { cursor: pointer; }

.icon {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.icon-sm { width: 18px; height: 18px; }
.icon-lg { width: 26px; height: 26px; }

.screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  z-index: 10;
  overflow: hidden;
}
.screen.hidden { display: none; }

#authScreen {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 24px;
  overflow-y: auto;
  background: radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg) 70%);
}

.auth-logo { text-align: center; margin-bottom: 32px; }

.auth-logo-mark {
  width: 80px;
  height: 80px;
  margin: 0 auto 16px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 36px;
  font-weight: 800;
  box-shadow: 0 10px 30px rgba(59,130,246,0.4);
}

.auth-title {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.auth-subtitle {
  font-size: 12px;
  color: var(--text-2);
  margin-top: 4px;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 600;
}

.auth-tabs {
  display: flex;
  background: var(--bg-3);
  border-radius: var(--radius);
  padding: 4px;
  margin-bottom: 20px;
}

.auth-tab {
  flex: 1;
  padding: 10px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  color: var(--text-2);
  transition: all 0.2s;

}

.auth-tab.active {
  background: var(--accent);
  color: white;
  box-shadow: 0 2px 8px rgba(59,130,246,0.3);
}

.auth-form { display: flex; flex-direction: column; gap: 12px; }

.field { display: flex; flex-direction: column; gap: 6px; }

.field label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
  background: var(--bg-2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  transition: border-color 0.2s, background 0.2s;
}

.input-wrap:focus-within { border-color: var(--accent); background: var(--bg-3); }

.input-wrap .icon-sm { position: absolute; left: 14px; color: var(--text-3); pointer-events: none; }

.input-wrap input,
.input-wrap textarea {
  flex: 1;
  padding: 14px 14px 14px 42px;
  font-size: 15px;
  color: var(--text);
  background: transparent;
  width: 100%;
}

.input-wrap input::placeholder,
.input-wrap textarea::placeholder { color: var(--text-3); }

.password-toggle {
  position: absolute;
  right: 12px;
  padding: 6px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 20px;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 15px;
  transition: all 0.2s;
  width: 100%;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-hover));
  color: white;
  box-shadow: 0 4px 12px rgba(59,130,246,0.3);
}

.btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(59,130,246,0.4); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

.btn-secondary {
  background: var(--bg-3);

  border: 1.5px solid var(--border);

.btn-danger { background: var(--danger); color: white; }
.btn-ghost { background: transparent; color: var(--text-2); }
.btn-sm { padding: 8px 14px; font-size: 13px; width: auto; }

.btn-icon {

.app-header {

.app-header .header-actions { display: flex; gap: 4px; align-items: center; }

.app-main {

.bottom-nav {

.nav-item {

.nav-item.active { color: var(--accent); }

.nav-item span { font-size: 10px; font-weight: 600; }

.nav-item .badge {

  font-weight: 700;

.toast-container {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
  width: calc(100% - 32px);

}

.toast {
  background: var(--bg-3);
  border: 1px solid var(--border-2);
  color: var(--text);
  padding: 12px 16px;
  border-radius: var(--radius);

}

.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--danger); }
.toast.info { border-color: var(--accent); }

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

.loader {
  width: 20px;
  height: 20px;
  border: 2.5px solid rgba(255,255,255,0.2);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

.loader-lg {
  width: 40px;
  height: 40px;
  border-width: 3px;
  border-color: var(--border);
  border-top-color: var(--accent);
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  z-index: 9999;
}

.loading-screen p { color: var(--text-2); font-size: 14px; }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-content {
  background: var(--bg-2);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;

  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.3s ease;
  border-top: 1px solid var(--border);
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px;
  border-bottom: 1px solid var(--border);
  position: sticky;

}

.modal-header h3 { font-size: 16px; font-weight: 700; }
.modal-body { padding: 16px; }

.modal-handle {

.post-card { background: var(--bg-2); border-bottom: 1px solid var(--border); margin-bottom: 8px; }

@media (min-width: 640px) {
  .post-card { border-radius: var(--radius); border: 1px solid var(--border); margin: 8px 12px; }
}
</style>

<script>
/* ============================================================
   MSAFIRI GLOBAL MEDIA - PHASE 1 FRONTEND (PART 2A)
   ============================================================ */

'use strict';

const API = window.location.origin;
let TOKEN = localStorage.getItem('msafiri_token') || null;
let CURRENT_USER = null;
let CURRENT_VIEW = 'home';
let CACHED_POSTS = [];
let CACHED_CHATS = [];

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') {
      node.addEventListener(k.slice(2).toLowerCase(), v);
    } else if (v !== null && v !== undefined && v !== false) {
      node.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    if (typeof c === 'string') node.appendChild(document.createTextNode(c));
    else if (c instanceof Node) node.appendChild(c);
  }
  return node;
}

function esc(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function api(path, opts = {}) {
  const headers = opts.headers || {};
  if (!(opts.body instanceof FormData)) {
    headers['Content-Type'] = headers['Content-Type'] || 'application/json';
  }
  if (TOKEN) headers['Authorization'] = `Bearer ${TOKEN}`;

  const res = await fetch(API + path, { ...opts, headers });
  let data = null;
  const ct = res.headers.get('content-type') || '';
  if (ct.includes('application/json')) {
    try { data = await res.json(); } catch (_) { data = null; }
  } else {
    data = await res.text();
  }

  if (!res.ok) {
    const msg = (data && data.detail) || (data && data.message) || (typeof data === 'string' ? data : `HTTP ${res.status}`);
    const err = new Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
    err.status = res.status;
    throw err;
  }
  return data;
}

function toast(message, type = 'info', duration = 3000) {
  const container = $('#toastContainer');
  const t = el('div', { class: `toast ${type}` });
  const icons = {
    success: '<polyline points="20 6 9 17 4 12"/>',
    error: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
    info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
  };
  t.innerHTML = `<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[type] || icons.info}</svg><span>${esc(message)}</span>`;
  container.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, duration);
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('msafiri_theme', theme);
}

function initTheme() {
  const saved = localStorage.getItem('msafiri_theme') || 'dark';
  applyTheme(saved);
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  if (CURRENT_USER) {
    api('/api/profile', { method: 'PATCH', body: JSON.stringify({ theme: next }) }).catch(() => {});
  }
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const now = new Date();
  const s = Math.floor((now - d) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 604800) return Math.floor(s / 86400) + 'd';
  if (s < 2592000) return Math.floor(s / 604800) + 'w';
  return d.toLocaleDateString();
}

function initials(name) {
  if (!name) return '?';
  return name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
}

function avatarEl(user, size = 40) {
  const wrap = el('div', {
    style: `width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:${Math.round(size*0.4)}px;flex-shrink:0;`
  });
  if (user && user.avatar) {
    wrap.appendChild(el('img', { src: user.avatar, style: 'width:100%;height:100%;object-fit:cover;' }));
  } else {
    wrap.textContent = initials(user && user.name);
  }
  return wrap;
}

function renderPost(post) {
  const card = el('article', { class: 'post-card', dataset: { postId: post.id } });
  const header = el('div', { class: 'post-header' });
  const userInfo = el('div', {
    style: 'display:flex;align-items:center;gap:10px;cursor:pointer;',
    onclick: () => openProfile(post.user.id),
  });
  userInfo.appendChild(avatarEl(post.user, 40));
  const names = el('div');
  names.appendChild(el('div', { style: 'font-weight:600;font-size:14px;' }, post.user.name));
  const uname = post.user.username ? '@' + post.user.username + ' · ' : '';
  names.appendChild(el('div', { style: 'font-size:12px;color:var(--text-3);' }, uname + timeAgo(post.created_at)));
  userInfo.appendChild(names);
  header.appendChild(userInfo);

  if (CURRENT_USER && post.user.id === CURRENT_USER.id) {
    const menuBtn = el('button', { class: 'btn-icon', style: 'width:32px;height:32px;' });
    menuBtn.innerHTML = '<svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>';
    menuBtn.addEventListener('click', (e) => { e.stopPropagation(); openPostMenu(post); });
    header.appendChild(menuBtn);
  }
  card.appendChild(header);

  if (post.caption) {
    card.appendChild(el('div', { style: 'padding:0 16px 12px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;' }, post.caption));
  }

  if (post.media) {
    const mediaWrap = el('div', { style: 'background:#000;display:flex;justify-content:center;' });
    if (post.media_type === 'video') {
      mediaWrap.appendChild(el('video', { src: post.media, controls: true, playsinline: true, style: 'max-width:100%;max-height:70vh;display:block;' }));
    } else {
      mediaWrap.appendChild(el('img', { src: post.media, style: 'max-width:100%;max-height:70vh;display:block;object-fit:contain;', loading: 'lazy' }));
    }
    card.appendChild(mediaWrap);
  }

  const actions = el('div', { style: 'display:flex;align-items:center;gap:2px;padding:8px 8px 12px;' });
  actions.appendChild(makeActionBtn(post.liked, 'like', post.likes_count || 0, post.liked ? 'var(--danger)' : null, () => toggleLike(post)));
  actions.appendChild(makeActionBtn(false, 'comment', post.comments_count || 0, null, () => openComments(post)));
  actions.appendChild(makeActionBtn(false, 'reshare', post.reshares_count || 0, null, () => toggleReshare(post)));
  actions.appendChild(makeActionBtn(post.saved, 'save', null, post.saved ? 'var(--accent)' : null, () => toggleSave(post)));
  card.appendChild(actions);
  return card;
}

  });
  const icons = {

    comment: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
    reshare: '<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
    save: '<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',

async function loadFeed(feedType = 'all') {
  const main = $('#appMain');
  main.innerHTML = '<div style="display:flex;justify-content:center;padding:40px;"><div class="loader loader-lg"></div></div>';
  try {
    const data = await api('/api/posts?feed=' + encodeURIComponent(feedType) + '&limit=30');
    CACHED_POSTS = data.posts || [];
    renderFeed(feedType);
  } catch (err) {
    main.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-2);"><p>Failed to load feed</p><p class="text-sm" style="margin-top:8px;">${esc(err.message)}</p></div>`;
  }
}

function renderFeed(feedType = 'all') {
  const main = $('#appMain');
  main.innerHTML = '';
  const tabs = el('div', { style: 'display:flex;background:var(--bg-2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:4;' });
  ['all', 'following'].forEach(f => {
    const active = f === feedType;
    const t = el('button', {
      style: `flex:1;padding:12px;font-weight:600;font-size:14px;color:${active ? 'var(--accent)' : 'var(--text-2)'};border-bottom:2px solid ${active ? 'var(--accent)' : 'transparent'};`,
      onclick: () => loadFeed(f),
    }, f === 'all' ? 'For You' : 'Following');
    tabs.appendChild(t);
  });
  main.appendChild(tabs);

  if (CACHED_POSTS.length === 0) {
    main.appendChild(el('div', { style: 'padding:60px 20px;text-align:center;color:var(--text-2);' },
      el('p', {}, 'No posts yet'),
      el('p', { style: 'margin-top:8px;font-size:14px;' }, 'Be the first to share something!')));
    return;
  }
  for (const p of CACHED_POSTS) main.appendChild(renderPost(p));
}

async function toggleLike(post) {
  try {
    if (post.liked) {
      await api(`/api/posts/${post.id}/like`, { method: 'DELETE' });
      post.liked = false;
      post.likes_count = Math.max(0, (post.likes_count || 0) - 1);
    } else {
      await api(`/api/posts/${post.id}/like`, { method: 'POST' });
      post.liked = true;
      post.likes_count = (post.likes_count || 0) + 1;
    }
    updatePostCard(post);
  } catch (err) { toast(err.message, 'error'); }
}

async function toggleSave(post) {
  try {
    if (post.saved) {
      await api(`/api/posts/${post.id}/save`, { method: 'DELETE' });
      post.saved = false;
      toast('Removed', 'info');
    } else {
      await api(`/api/posts/${post.id}/save`, { method: 'POST' });
      post.saved = true;
      toast('Saved', 'success');
    }
    updatePostCard(post);
  } catch (err) { toast(err.message, 'error'); }
}

async function toggleReshare(post) {
  try {
    await api(`/api/posts/${post.id}/reshare`, { method: 'POST' });
    post.reshares_count = (post.reshares_count || 0) + 1;
    toast('Reshared', 'success');
    updatePostCard(post);
  } catch (err) { toast(err.message, 'error'); }
}

function updatePostCard(post) {
  const old = document.querySelector(`[data-post-id="${post.id}"]`);
  if (!old) return;
  old.replaceWith(renderPost(post));
}

function openSheet(title, items, contentNode = null) {
  const container = $('#modalContainer');
  container.innerHTML = '';
  const overlay = el('div', { class: 'modal-overlay', onclick: (e) => { if (e.target === overlay) closeModal(); } });
  const content = el('div', { class: 'modal-content' });
  content.appendChild(el('div', { class: 'modal-handle' }));

  if (title) {
    const h = el('div', { class: 'modal-header' });
    h.appendChild(el('h3', {}, title));
    const cb = el('button', { class: 'btn-icon', onclick: closeModal });
    cb.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    h.appendChild(cb);
    content.appendChild(h);
  }

  const body = el('div', { class: 'modal-body', style: 'padding:8px 0;' });
  if (contentNode) body.appendChild(contentNode);
  if (items) {
    for (const item of items) {
      const btn = el('button', {
        style: `display:block;width:100%;text-align:left;padding:14px 20px;font-size:15px;background:none;color:${item.danger ? 'var(--danger)' : 'var(--text)'};`,
        onclick: () => { closeModal(); item.onClick && item.onClick(); }
      }, item.label);
      body.appendChild(btn);
    }
  }
  content.appendChild(body);
  overlay.appendChild(content);
  container.appendChild(overlay);
}

function closeModal() { $('#modalContainer').innerHTML = ''; }

function openPostMenu(post) {
  const items = [];
  if (CURRENT_USER && post.user.id === CURRENT_USER.id) {
    items.push({ label: 'Delete Post', danger: true, onClick: async () => {
      if (!confirm('Delete this post?')) return;
      try {
        await api(`/api/posts/${post.id}`, { method: 'DELETE' });
        toast('Deleted', 'success');
        CACHED_POSTS = CACHED_POSTS.filter(p => p.id !== post.id);
        renderFeed();
      } catch (err) { toast(err.message, 'error'); }
    }});
  }
  items.push({ label: 'Copy Link', onClick: () => {
    const url = `${API}/?post=${post.id}`;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Copied', 'success'));
    else toast(url, 'info');
  }});
  openSheet('Post Options', items);
}

function openEditProfile() {

  const content = el('div', { class: 'modal-content' });

  h.appendChild(cb);

    if (f.size > 2 * 1024 * 1024) { toast('Max 2 MB', 'error'); return; }
    const fd = new FormData();
    fd.append('file', f);
    try {
      await api('/api/profile/avatar', { method: 'POST', body: fd });
      toast('Avatar updated', 'success');
      await loadMe();
      closeModal();
      openProfile(CURRENT_USER.id);
    } catch (err) { toast(err.message, 'error'); }
  });
  body.appendChild(avFile);
  body.appendChild(avWrap);

  const fields = [
    { key: 'name', label: 'Name', value: CURRENT_USER.name || '' },
    { key: 'username', label: 'Username', value: CURRENT_USER.username || '' },
    { key: 'bio', label: 'Bio', value: CURRENT_USER.bio || '', multiline: true },
    { key: 'location', label: 'Location', value: CURRENT_USER.location || '' },

    inpWrap.appendChild(inp);
    wrap.appendChild(inpWrap);
    body.appendChild(wrap);

  }

  const saveBtn = el('button', {
    class: 'btn btn-primary',
    style: 'margin-top:8px;',
    onclick: async () => {
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<div class="loader"></div>';

          method: 'PATCH',
          body: JSON.stringify({
            name: inputs.name.value.trim(),
            username: inputs.username.value.trim() || null,
            bio: inputs.bio.value.trim(),
            location: inputs.location.value.trim(),
          }),

        toast(err.message, 'error');

    }
  }, el('span', {}, 'Save'));
  body.appendChild(saveBtn);
  content.appendChild(body);
  overlay.appendChild(content);
  container.appendChild(overlay);
}

function appendMessage(m) {
  const msgsWrap = $('#msgsWrap');
  if (!msgsWrap) return;
  const mine = CURRENT_USER && m.sender_id === CURRENT_USER.id;
  const row = el('div', { style: `display:flex;justify-content:${mine ? 'flex-end' : 'flex-start'};` });
  const bubble = el('div', {
    style: `max-width:75%;padding:8px 12px;border-radius:16px;font-size:14px;line-height:1.4;word-break:break-word;background:${mine ? 'var(--accent)' : 'var(--bg-3)'};color:${mine ? 'white' : 'var(--text)'};`
  });
  if (m.media && m.media_type === 'voice') {
    const audio = el('audio', { src: m.media, controls: true, style: 'max-width:220px;' });
    bubble.appendChild(audio);
    if (m.duration_seconds) {
      bubble.appendChild(el('div', { style: 'font-size:11px;opacity:0.7;margin-top:4px;' }, m.duration_seconds + 's'));
    }
  } else if (m.media && m.media_type === 'image') {
    bubble.appendChild(el('img', { src: m.media, style: 'max-width:100%;border-radius:8px;margin-bottom:4px;' }));
    if (m.text) bubble.appendChild(el('div', {}, m.text));
  } else if (m.media && m.media_type === 'video') {
    bubble.appendChild(el('video', { src: m.media, controls: true, style: 'max-width:220px;border-radius:8px;' }));
    if (m.text) bubble.appendChild(el('div', {}, m.text));
  } else if (m.media) {
    const a = el('a', { href: m.media, download: 'file', style: 'color:inherit;text-decoration:underline;' }, '📎 Download file');
    bubble.appendChild(a);
    if (m.text) bubble.appendChild(el('div', { style: 'margin-top:4px;' }, m.text));
  } else {
    bubble.appendChild(el('div', {}, m.text || ''));
  }
  bubble.appendChild(el('div', { style: `font-size:10px;opacity:0.7;margin-top:4px;text-align:${mine ? 'right' : 'left'};` }, timeAgo(m.created_at)));
  row.appendChild(bubble);
  msgsWrap.appendChild(row);
  msgsWrap.scrollTop = msgsWrap.scrollHeight;
}

function openChatAttach(otherId) {
  const items = [
    { label: '📷 Photo / Video', onClick: () => pickChatFile(otherId, 'image/*,video/*', 'media') },

function pickChatFile(otherId, accept, kind) {
  const inp = el('input', { type: 'file', accept, style: 'display:none' });
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) { toast('Max 5 MB', 'error'); return; }
    const fd = new FormData();
    fd.append('receiver_id', otherId);
    fd.append('text', '');
    fd.append('file', f);
    try {
      const res = await api('/api/messages/file', { method: 'POST', body: fd });
      appendMessage(res.message);
    } catch (err) { toast(err.message, 'error'); }
  });
  document.body.appendChild(inp);
  inp.click();
  setTimeout(() => inp.remove(), 1000);
}

async function recordVoice(otherId) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('Recording not supported on this browser', 'error');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const recorder = new MediaRecorder(stream);
    const chunks = [];
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: 'audio/webm' });
      if (blob.size > 2 * 1024 * 1024) { toast('Voice too large', 'error'); return; }
      const fd = new FormData();
      fd.append('receiver_id', otherId);
      fd.append('duration_seconds', '0');
      fd.append('file', blob, 'voice.webm');
      try {
        const res = await api('/api/messages/voice', { method: 'POST', body: fd });
        appendMessage(res.message);
      } catch (err) { toast(err.message, 'error'); }
    };
    recorder.start();

    // Stop after 30s max
    const maxTimer = setTimeout(() => recorder.stop(), 30000);

    const container = $('#modalContainer');
    container.innerHTML = '';
    const overlay = el('div', { class: 'modal-overlay', onclick: () => { clearTimeout(maxTimer); if (recorder.state !== 'inactive') recorder.stop(); closeModal(); } });
    const content = el('div', { class: 'modal-content', style: 'text-align:center;padding:32px 20px;' });
    content.appendChild(el('div', { style: 'font-size:20px;font-weight:700;margin-bottom:16px;' }, '🎙️ Recording...'));
    content.appendChild(el('div', { style: 'color:var(--text-2);font-size:14px;margin-bottom:24px;' }, 'Tap stop when done (max 30s)'));
    const stopBtn = el('button', {
      class: 'btn btn-danger',
      style: 'max-width:200px;margin:0 auto;',
      onclick: () => { clearTimeout(maxTimer); if (recorder.state !== 'inactive') recorder.stop(); closeModal(); }
    }, 'Stop & Send');
    content.appendChild(stopBtn);
    overlay.appendChild(content);
    container.appendChild(overlay);
  } catch (err) {
    toast('Mic permission denied', 'error');
  }
}

function openChatMenu(otherId, name) {
  const items = [
    { label: 'View Profile', onClick: () => openProfile(otherId) },
    { label: 'Chat Wallpaper', onClick: () => pickWallpaper(otherId) },
    { label: 'Clear Chat', danger: true, onClick: async () => {
      if (!confirm('Clear all messages in this chat?')) return;
      try {
        await api(`/api/chats/${otherId}`, { method: 'DELETE' });
        toast('Chat cleared', 'success');
        openChat(otherId, name);
      } catch (err) { toast(err.message, 'error'); }
    }},
    { label: 'Block User', danger: true, onClick: async () => {
      if (!confirm('Block ' + name + '?')) return;
      try {
        await api(`/api/users/${otherId}/block`, { method: 'POST' });
        toast('Blocked', 'success');
        openChats();
      } catch (err) { toast(err.message, 'error'); }
    }},
  ];
  openSheet('Chat Options', items);
}

function pickWallpaper(otherId) {
  const inp = el('input', { type: 'file', accept: 'image/*', style: 'display:none' });
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    if (f.size > 1024 * 1024) { toast('Max 1 MB', 'error'); return; }
    const fd = new FormData();
    fd.append('file', f);
    try {
      await api(`/api/chats/${otherId}/wallpaper`, { method: 'POST', body: fd });
      toast('Wallpaper set', 'success');
      const msgsWrap = $('#msgsWrap');
      if (msgsWrap) {
        const reader = new FileReader();
        reader.onload = () => { msgsWrap.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url(${reader.result})`; };
        reader.readAsDataURL(f);
      }
    } catch (err) { toast(err.message, 'error'); }
  });
  document.body.appendChild(inp);
  inp.click();
  setTimeout(() => inp.remove(), 1000);
}

async function openChatWith(user) {
  openChat(user.id, user.name, user.avatar, user.username);
}

async function startCall(otherId, type, name) {
  try {
    toast('Starting ' + type + ' call...', 'info');
    const res = await api('/api/calls/token', {
      method: 'POST',
      body: JSON.stringify({ receiver_id: otherId, call_type: type }),
    });
    // LiveKit integration
    toast('LiveKit ready: room ' + res.room_name, 'success');
    // Note: Full LiveKit client requires additional SDK
    alert('Call token created!\nRoom: ' + res.room_name + '\n\nNote: LiveKit client SDK integration needed for full call UI.');
  } catch (err) { toast(err.message, 'error'); }
}

// ============================================================
// SEARCH
// ============================================================
async function openSearch() {
  const main = $('#appMain');
  switchView('search');
  main.innerHTML = '';

  const header = el('div', { style: 'padding:12px 16px;' });
  const inputWrap = el('div', { class: 'input-wrap' });
  const icon = el('div');
  icon.innerHTML = '<svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
  inputWrap.appendChild(icon.firstChild);
  const inp = el('input', { type: 'text', placeholder: 'Search people...', style: 'padding-left:42px;' });
  inputWrap.appendChild(inp);
  header.appendChild(inputWrap);
  main.appendChild(header);

  const results = el('div');
  main.appendChild(results);

  let timer;
  inp.addEventListener('input', () => {
    clearTimeout(timer);
    const q = inp.value.trim();
    if (!q) { results.innerHTML = ''; return; }
    timer = setTimeout(async () => {
      results.innerHTML = '<div style="text-align:center;padding:20px;"><div class="loader" style="margin:0 auto;"></div></div>';
      try {
        const data = await api('/api/search?q=' + encodeURIComponent(q));
        results.innerHTML = '';
        if (!data.users || data.users.length === 0) {
          results.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-2);">No users found</div>';
        } else {
          for (const u of data.users) {
            const row = el('div', {
              style: 'display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);',
              onclick: () => openProfile(u.id),
            });
            row.appendChild(avatarEl(u, 44));
            const info = el('div');
            info.appendChild(el('div', { style: 'font-weight:600;font-size:14px;' }, u.name));
            if (u.username) info.appendChild(el('div', { style: 'font-size:12px;color:var(--text-3);' }, '@' + u.username));
            row.appendChild(info);
            results.appendChild(row);
          }
        }
      } catch (err) {
        results.innerHTML = `<div style="text-align:center;padding:20px;color:var(--danger);">${esc(err.message)}</div>`;
      }
    }, 400);
  });
}

// ============================================================
// NAVIGATION
// ============================================================
function switchView(view, extra) {
  CURRENT_VIEW = view;
  $$('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.view === view);
  });
}

function handleNav(view) {
  if (view === 'home') loadFeed('all');
  else if (view === 'search') openSearch();
  else if (view === 'create') openCreatePost();
  else if (view === 'chats') openChats();
  else if (view === 'profile') {
    if (CURRENT_USER) openProfile(CURRENT_USER.id);
  }
}

$$('.nav-item').forEach(item => {
  item.addEventListener('click', () => handleNav(item.dataset.view));
});

// ============================================================
// INIT
// ============================================================
async function startApp() {
  showApp();
  await loadFeed('all');
}

async function init() {
  initTheme();
  if (TOKEN) {
    try {
      await loadMe();
      await startApp();
    } catch (err) {
      TOKEN = null;
      localStorage.removeItem('msafiri_token');
      showAuth();
    }
  } else {
    showAuth();
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
