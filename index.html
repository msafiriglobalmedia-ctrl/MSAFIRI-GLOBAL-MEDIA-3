<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0e1a" />
<title>MSAFIRI GLOBAL MEDIA</title>
<style>
/* ============ RESET & VARIABLES ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e1a;--bg-2:#111827;--bg-3:#1a2235;--bg-hover:#1f2937;
  --border:#1f2937;--border-2:#2d3748;
  --text:#f1f5f9;--text-2:#94a3b8;--text-3:#64748b;
  --accent:#3b82f6;--accent-hover:#2563eb;--accent-2:#8b5cf6;
  --success:#10b981;--danger:#ef4444;--warning:#f59e0b;
  --radius:12px;--radius-sm:8px;--radius-lg:16px;
  --shadow:0 4px 12px rgba(0,0,0,0.3);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
[data-theme="light"]{
  --bg:#fff;--bg-2:#f8fafc;--bg-3:#f1f5f9;--bg-hover:#e2e8f0;
  --border:#e2e8f0;--border-2:#cbd5e1;
  --text:#0f172a;--text-2:#475569;--text-3:#94a3b8;
  --shadow:0 4px 12px rgba(0,0,0,0.08);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;overflow:hidden;transition:background .3s,color .3s}
body{display:flex;flex-direction:column}
input,textarea,button,select{font-family:inherit;font-size:inherit;outline:none;border:none;background:none;color:inherit}
button{cursor:pointer}img{max-width:100%;display:block}a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px}
.hidden{display:none!important}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.icon-sm{width:18px;height:18px}.icon-lg{width:26px;height:26px}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:10;overflow:hidden}
.screen.hidden{display:none}

/* ============ SPLASH SCREEN ============ */
#splashScreen {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0a1628 0%, #1e3a8a 30%, #2563eb 60%, #1e40af 100%);
  background-size: 300% 300%;
  animation: shiningBg 6s ease-in-out infinite;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
#splashScreen.fade-out {
  opacity: 0;
  visibility: hidden;
}
@keyframes shiningBg {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Shining overlay */
#splashScreen::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.15) 0%, transparent 60%);
  animation: shine 3s ease-in-out infinite;
  pointer-events: none;
}
@keyframes shine {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(1.1); }
}

.splash-logo {
  width: 140px;
  height: 140px;
  border-radius: 32px;
  background: linear-gradient(135deg, #60a5fa, #a78bfa);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 72px;
  font-weight: 900;
  letter-spacing: -3px;
  box-shadow: 0 20px 60px rgba(96,165,250,0.5), inset 0 -4px 20px rgba(0,0,0,0.2);
  margin-bottom: 32px;
  animation: heartbeat 6s ease-in-out infinite;
  position: relative;
  z-index: 2;
}
.splash-logo::after {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 40px;
  background: linear-gradient(135deg, rgba(96,165,250,0.4), rgba(167,139,250,0.4));
  filter: blur(20px);
  z-index: -1;
  animation: pulseGlow 6s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.08); }
  25% { transform: scale(1); }
  35% { transform: scale(1.05); }
  50% { transform: scale(1); }
}
@keyframes pulseGlow {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.15); }
}

.splash-title {
  font-size: 34px;
  font-weight: 900;
  color: #ffffff;
  letter-spacing: -0.5px;
  text-shadow: 0 4px 20px rgba(0,0,0,0.4);
  margin-bottom: 12px;
  text-align: center;
  padding: 0 20px;
  position: relative;
  z-index: 2;
  font-family: var(--font);
}

.splash-subtitle {
  font-size: 16px;
  color: rgba(255,255,255,0.85);
  font-weight: 500;
  letter-spacing: 3px;
  text-transform: uppercase;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  position: relative;
  z-index: 2;
}

/* ============ AUTH SCREEN ============ */
#authScreen{display:flex;flex-direction:column;justify-content:center;padding:24px;overflow-y:auto;background:radial-gradient(ellipse at top,var(--bg-2) 0%,var(--bg) 70%)}
.auth-logo{text-align:center;margin-bottom:32px}
.auth-logo-mark{width:80px;height:80px;margin:0 auto 16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-radius:22px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:36px;font-weight:800;box-shadow:0 10px 30px rgba(59,130,246,.4)}
.auth-title{font-size:24px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.auth-subtitle{font-size:12px;color:var(--text-2);margin-top:4px;letter-spacing:2px;text-transform:uppercase;font-weight:600}
.auth-tabs{display:flex;background:var(--bg-3);border-radius:var(--radius);padding:4px;margin-bottom:20px}
.auth-tab{flex:1;padding:10px;border-radius:var(--radius-sm);font-weight:600;color:var(--text-2);transition:all .2s;font-size:14px}
.auth-tab.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(59,130,246,.3)}
.auth-form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px}
.input-wrap{position:relative;display:flex;align-items:center;background:var(--bg-2);border:1.5px solid var(--border);border-radius:var(--radius);transition:border-color .2s,background .2s}
.input-wrap:focus-within{border-color:var(--accent);background:var(--bg-3)}
.input-wrap .icon-sm{position:absolute;left:14px;color:var(--text-3);pointer-events:none}
.input-wrap input,.input-wrap textarea{flex:1;padding:14px 14px 14px 42px;font-size:15px;color:var(--text);background:transparent;width:100%}
.input-wrap input::placeholder,.input-wrap textarea::placeholder{color:var(--text-3)}
.password-toggle{position:absolute;right:12px;padding:6px;color:var(--text-3);display:flex;align-items:center;justify-content:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:var(--radius);font-weight:600;font-size:15px;transition:all .2s;width:100%}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-hover));color:#fff;box-shadow:0 4px 12px rgba(59,130,246,.3)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-secondary{background:var(--bg-3);color:var(--text);border:1.5px solid var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-icon{width:40px;height:40px;padding:0;border-radius:50%;background:transparent;color:var(--text-2);display:flex;align-items:center;justify-content:center;transition:background .2s;flex-shrink:0}
.btn-icon:hover{background:var(--bg-hover);color:var(--text)}
.error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;text-align:center}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg-2);border-bottom:1px solid var(--border);flex-shrink:0;position:sticky;top:0;z-index:5}
.app-header h1{font-size:17px;font-weight:800;letter-spacing:-.3px;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-header .header-actions{display:flex;gap:4px;align-items:center}
.app-main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:70px;-webkit-overflow-scrolling:touch}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;background:var(--bg-2);border-top:1px solid var(--border);padding:8px 4px;z-index:50;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--text-3);transition:color .2s;position:relative;cursor:pointer}
.nav-item.active{color:var(--accent)}
.nav-item span{font-size:10px;font-weight:600}
.nav-item .badge{position:absolute;top:2px;right:50%;margin-right:-18px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 32px);max-width:400px}
.toast{background:var(--bg-3);border:1px solid var(--border-2);color:var(--text);padding:12px 16px;border-radius:var(--radius);font-size:14px;box-shadow:var(--shadow);animation:slideDown .3s;display:flex;align-items:center;gap:10px}
.toast.success{border-color:var(--success)}.toast.error{border-color:var(--danger)}.toast.info{border-color:var(--accent)}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.loader{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.loader-lg{width:40px;height:40px;border-width:3px;border-color:var(--border);border-top-color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-content{background:var(--bg-2);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;animation:slideUp .3s;border-top:1px solid var(--border)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-2);z-index:1}
.modal-header h3{font-size:16px;font-weight:700}
.modal-body{padding:16px}
.modal-handle{width:40px;height:4px;background:var(--border-2);border-radius:2px;margin:8px auto 0}
.post-card{background:var(--bg-2);border-bottom:1px solid var(--border);margin-bottom:8px}
.post-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
@media(min-width:640px){.post-card{border-radius:var(--radius);border:1px solid var(--border);margin:8px 12px}}
</style>
</head>
<body>

<!-- ============ SPLASH SCREEN ============ -->
<div id="splashScreen">
  <div class="splash-logo">M</div>
  <div class="splash-title">Msafiri Global Media</div>
  <div class="splash-subtitle">Connect beyond</div>
</div>

<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen" class="screen hidden">
  <div class="auth-logo">

        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>

<!-- ============ APP SCREEN ============ -->

<div id="modalContainer"></div>
<div class="toast-container" id="toastContainer"></div>

<script>
/* ============================================================
   MSAFIRI GLOBAL MEDIA - PHASE 1 + 2
   ============================================================ */
'use strict';

const API = window.location.origin;
let TOKEN = null;
let CURRENT_USER = null;
let CURRENT_VIEW = 'home';
let CACHED_POSTS = [];
let CACHED_CHATS = [];

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') {
      node.addEventListener(k.slice(2).toLowerCase(), v);
    } else if (v !== null && v !== undefined && v !== false) {
      node.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    if (typeof c === 'string') node.appendChild(document.createTextNode(c));
    else if (c instanceof Node) node.appendChild(c);
  }
  return node;
}

function esc(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ============ API CLIENT ============
async function api(path, opts = {}) {
  const headers = opts.headers || {};
  if (!(opts.body instanceof FormData)) {
    headers['Content-Type'] = headers['Content-Type'] || 'application/json';
  }
  if (TOKEN) headers['Authorization'] = `Bearer ${TOKEN}`;
  let res;
  try {
    res = await fetch(API + path, { ...opts, headers });
  } catch (networkErr) {
    console.warn('[MSAFIRI] Network error, retrying in 2s...');
    await new Promise(r => setTimeout(r, 2000));
    res = await fetch(API + path, { ...opts, headers });
  }
  let data = null;
  const ct = res.headers.get('content-type') || '';
  if (ct.includes('application/json')) {
    try { data = await res.json(); } catch (_) { data = null; }
  } else {
    data = await res.text();
  }
  if (!res.ok) {
    if (res.status === 401 && TOKEN && !path.includes('/login') && !path.includes('/register')) {
      console.warn('[MSAFIRI] Session expired');
      TOKEN = null;
      CURRENT_USER = null;
      localStorage.removeItem('msafiri_token');
      showAuth();
    }
    const msg = (data && data.detail) || (data && data.message) || (typeof data === 'string' ? data : `HTTP ${res.status}`);
    const err = new Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
    err.status = res.status;
    throw err;
  }
  return data;
}

// ============ TOAST ============
function toast(message, type = 'info', duration = 3000) {
  const container = $('#toastContainer');
  const t = el('div', { class: `toast ${type}` });
  const icons = {
    success: '<polyline points="20 6 9 17 4 12"/>',
    error: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
    info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
  };
  t.innerHTML = `<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[type] || icons.info}</svg><span>${esc(message)}</span>`;
  container.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, duration);
}

// ============ THEME ============
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('msafiri_theme', theme);
}
function initTheme() {
  const saved = localStorage.getItem('msafiri_theme') || 'dark';
  applyTheme(saved);
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  if (CURRENT_USER) {
    api('/api/profile', { method: 'PATCH', body: JSON.stringify({ theme: next }) }).catch(() => {});
  }
}

// ============ SESSION ============
function saveSession(token) {
  TOKEN = token;
  localStorage.setItem('msafiri_token', token);
  localStorage.setItem('msafiri_token_time', Date.now().toString());
  try { sessionStorage.setItem('msafiri_token', token); } catch(e) {}
}
function getSavedToken() {
  let t = localStorage.getItem('msafiri_token');
  if (!t) {
    try { t = sessionStorage.getItem('msafiri_token'); } catch(e) {}
  }
  return t;
}

// ============ AUTH ============
async function register(name, email, password, username) {
  return api('/api/register', { method: 'POST', body: JSON.stringify({ name, email, password, username: username || null }) });
}
async function login(email, password) {
  return api('/api/login', { method: 'POST', body: JSON.stringify({ email, password }) });
}
async function logout() {
  try { await api('/api/logout', { method: 'POST' }); } catch (_) {}
  TOKEN = null;
  CURRENT_USER = null;
  localStorage.removeItem('msafiri_token');
  localStorage.removeItem('msafiri_token_time');
  try { sessionStorage.removeItem('msafiri_token'); } catch(e) {}
  showAuth();
}
async function loadMe() {
  const data = await api('/api/me');
  CURRENT_USER = data.user;
  return CURRENT_USER;
}

// ============ SCREENS ============
function showAuth() {
  $('#splashScreen').classList.add('fade-out');
  $('#authScreen').classList.remove('hidden');
  $('#appScreen').classList.add('hidden');
}
function showApp() {
  $('#splashScreen').classList.add('fade-out');

  $('#appScreen').classList.remove('hidden');

$$('.auth-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const t = tab.dataset.tab;
    $$('.auth-tab').forEach(x => x.classList.toggle('active', x === tab));
    $('#loginForm').classList.toggle('hidden', t !== 'login');
    $('#registerForm').classList.toggle('hidden', t !== 'register');
    $('#loginError').classList.add('hidden');
    $('#registerError').classList.add('hidden');
  });
});

$$('.password-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const inp = $('#' + btn.dataset.target);
    if (!inp) return;
    inp.type = inp.type === 'password' ? 'text' : 'password';
  });
});

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#loginBtn');
  const errEl = $('#loginError');
  errEl.classList.add('hidden');
  btn.disabled = true;
  btn.innerHTML = '<div class="loader"></div>';
  try {
    const email = $('#loginEmail').value.trim();
    const password = $('#loginPassword').value;
    const res = await login(email, password);
    saveSession(res.token);
    CURRENT_USER = res.user;
    toast('Welcome back!', 'success');
    await startApp();
  } catch (err) {
    errEl.textContent = err.message || 'Login failed';
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>Login</span>';
  }
});

$('#registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#registerBtn');
  const errEl = $('#registerError');
  errEl.classList.add('hidden');
  btn.disabled = true;
  btn.innerHTML = '<div class="loader"></div>';
  try {

// ============ HELPERS ============
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const now = new Date();
  const s = Math.floor((now - d) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 604800) return Math.floor(s / 86400) + 'd';
  if (s < 2592000) return Math.floor(s / 604800) + 'w';
  return d.toLocaleDateString();
}
function initials(name) {
  if (!name) return '?';
  return name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
}
function avatarEl(user, size = 40) {
  const wrap = el('div', {
    style: `width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:${Math.round(size*0.4)}px;flex-shrink:0;`
  });
  if (user && user.avatar) {
    wrap.appendChild(el('img', { src: user.avatar, style: 'width:100%;height:100%;object-fit:cover;' }));
  } else {
    wrap.textContent = initials(user && user.name);
  }
  return wrap;
}

// ============ POST RENDERER ============
function renderPost(post) {
  const card = el('article', { class: 'post-card', dataset: { postId: post.id } });
  const header = el('div', { class: 'post-header' });
  const userInfo = el('div', {
    style: 'display:flex;align-items:center;gap:10px;cursor:pointer;',
    onclick: () => openProfile(post.user.id),
  });
  userInfo.appendChild(avatarEl(post.user, 40));
  const names = el('div');
  names.appendChild(el('div', { style: 'font-weight:600;font-size:14px;' }, post.user.name));
  const uname = post.user.username ? '@' + post.user.username + ' · ' : '';
  names.appendChild(el('div', { style: 'font-size:12px;color:var(--text-3);' }, uname + timeAgo(post.created_at)));
  userInfo.appendChild(names);
  header.appendChild(userInfo);
  if (CURRENT_USER && post.user.id === CURRENT_USER.id) {
    const menuBtn = el('button', { class: 'btn-icon', style: 'width:32px;height:32px;' });
    menuBtn.innerHTML = '<svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>';
    menuBtn.addEventListener('click', (e) => { e.stopPropagation(); openPostMenu(post); });
    header.appendChild(menuBtn);
  }
  card.appendChild(header);
  if (post.caption) {
    card.appendChild(el('div', { style: 'padding:0 16px 12px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;' }, post.caption));
  }
  if (post.media) {
    const mediaWrap = el('div', { style: 'background:#000;display:flex;justify-content:center;' });
    if (post.media_type === 'video') {
      mediaWrap.appendChild(el('video', { src: post.media, controls: true, playsinline: true, style: 'max-width:100%;max-height:70vh;display:block;' }));
    } else {
      mediaWrap.appendChild(el('img', { src: post.media, style: 'max-width:100%;max-height:70vh;display:block;object-fit:contain;', loading: 'lazy' }));
    }
    card.appendChild(mediaWrap);
  }
  const actions = el('div', { style: 'display:flex;align-items:center;gap:2px;padding:8px 8px 12px;' });
  actions.appendChild(makeActionBtn(post.liked, 'like', post.likes_count || 0, post.liked ? 'var(--danger)' : null, () => toggleLike(post)));
  actions.appendChild(makeActionBtn(false, 'comment', post.comments_count || 0, null, () => openComments(post)));
  actions.appendChild(makeActionBtn(false, 'reshare', post.reshares_count || 0, null, () => toggleReshare(post)));
  actions.appendChild(makeActionBtn(post.saved, 'save', null, post.saved ? 'var(--accent)' : null, () => toggleSave(post)));
  card.appendChild(actions);
  return card;
}

function makeActionBtn(filled, kind, count, color, onClick) {
  const btn = el('button', {
    class: 'btn-icon',
    style: `flex:1;height:36px;gap:6px;padding:0 8px;border-radius:8px;color:${color || 'var(--text-2)'};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;`,
  });
  const icons = {
    like: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
    comment: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
    reshare: '<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
    save: '<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
  };
  const fillStyle = filled ? 'fill:currentColor;' : '';
  btn.innerHTML = `<svg class="icon icon-sm" viewBox="0 0 24 24" style="${fillStyle}">${icons[kind]}</svg>${count != null ? `<span>${count > 0 ? count : ''}</span>` : ''}`;
  btn.addEventListener('click', (e) => { e.stopPropagation(); onClick(); });
  return btn;
}

// ============ FEED ============
async function loadFeed(feedType = 'all') {
  const main = $('#appMain');
  main.innerHTML = '<div style="display:flex;justify-content:center;padding:40px;"><div class="loader loader-lg"></div></div>';
  try {
    const data = await api('/api/posts?feed=' + encodeURIComponent(feedType) + '&limit=30');
    CACHED_POSTS = data.posts || [];
    renderFeed(feedType);
  } catch (err) {
    main.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-2);"><p>Failed to load feed</p><p style="font-size:13px;margin-top:8px;">${esc(err.message)}</p></div>`;
  }
}

function renderFeed(feedType = 'all') {
  const main = $('#appMain');
  main.innerHTML = '';
  const tabs = el('div', { style: 'display:flex;background:var(--bg-2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:4;' });
  ['all', 'following'].forEach(f => {
    const active = f === feedType;
    const t = el('button', {
      style: `flex:1;padding:12px;font-weight:600;font-size:14px;color:${active ? 'var(--accent)' : 'var(--text-2)'};border-bottom:2px solid ${active ? 'var(--accent)' : 'transparent'};`,
      onclick: () => loadFeed(f),
    }, f === 'all' ? 'For You' : 'Following');
    tabs.appendChild(t);
  });
  main.appendChild(tabs);

  // Stories bar
  const storiesBar = el('div', {
    style: 'display:flex;gap:12px;padding:12px 16px;overflow-x:auto;background:var(--bg-2);border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch;',
    id: 'storiesBar',
  });
  main.appendChild(storiesBar);

  const addStoryBtn = el('div', {
    style: 'display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;min-width:70px;',
    onclick: () => openCreateStory(),
  });
  const addWrap = el('div', {
    style: 'width:64px;height:64px;border-radius:50%;background:var(--bg-3);border:2px dashed var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:28px;',
  }, '+');
  addStoryBtn.appendChild(addWrap);
  addStoryBtn.appendChild(el('div', { style: 'font-size:11px;color:var(--text-2);font-weight:600;' }, 'My Story'));
  storiesBar.appendChild(addStoryBtn);

  loadStories(storiesBar);

  if (CACHED_POSTS.length === 0) {
    main.appendChild(el('div', { style: 'padding:60px 20px;text-align:center;color:var(--text-2);' },
      el('p', {}, 'No posts yet'),
      el('p', { style: 'margin-top:8px;font-size:14px;' }, 'Be the first to share something!')));
    return;
  }
  for (const p of CACHED_POSTS) main.appendChild(renderPost(p));
}

async function loadStories(storiesBar) {
  try {
    const data = await api('/api/statuses');
    const groups = data.groups || [];
    if (groups.length === 0) {
      storiesBar.appendChild(el('div', { style: 'display:flex;align-items:center;color:var(--text-3);font-size:13px;padding:0 8px;' }, 'No stories yet'));
      return;
    }
    for (const g of groups) {
      const isMe = CURRENT_USER && g.user.id === CURRENT_USER.id;
      const storyItem = el('div', {
        style: 'display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;min-width:70px;',
        onclick: () => openStoryViewer(g),
      });
      const ring = el('div', {
        style: 'width:68px;height:68px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;',
      });
      const inner = el('div', {
        style: 'width:100%;height:100%;border-radius:50%;overflow:hidden;border:2px solid var(--bg-2);background:var(--bg-3);display:flex;align-items:center;justify-content:center;',
      });
      if (g.user.avatar) {
        inner.appendChild(el('img', { src: g.user.avatar, style: 'width:100%;height:100%;object-fit:cover;' }));
      } else {
        inner.textContent = initials(g.user.name);
        inner.style.color = 'white';
        inner.style.fontWeight = '700';
        inner.style.fontSize = '24px';
        inner.style.background = 'linear-gradient(135deg,#3b82f6,#8b5cf6)';
      }
      ring.appendChild(inner);
      storyItem.appendChild(ring);
      const label = isMe ? 'My Story' : g.user.name.split(' ')[0];
      storyItem.appendChild(el('div', { style: 'font-size:11px;color:var(--text-2);font-weight:600;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;' }, label));
      storiesBar.appendChild(storyItem);
    }
  } catch (err) {
    console.warn('Stories load failed:', err.message);
  }
}

// ============ ACTIONS ============
async function toggleLike(post) {
  try {
    if (post.liked) {
      await api(`/api/posts/${post.id}/like`, { method: 'DELETE' });
      post.liked = false;
      post.likes_count = Math.max(0, (post.likes_count || 0) - 1);
    } else {
      await api(`/api/posts/${post.id}/like`, { method: 'POST' });
      post.liked = true;
      post.likes_count = (post.likes_count || 0) + 1;
    }
    updatePostCard(post);
  } catch (err) { toast(err.message, 'error'); }
}
async function toggleSave(post) {
  try {
    if (post.saved) {
      await api(`/api/posts/${post.id}/save`, { method: 'DELETE' });
      post.saved = false;
      toast('Removed', 'info');
    } else {
      await api(`/api/posts/${post.id}/save`, { method: 'POST' });
      post.saved = true;
      toast('Saved', 'success');
    }
    updatePostCard(post);
  } catch (err) { toast(err.message, 'error'); }
}
async function toggleReshare(post) {
  try {
    await api(`/api/posts/${post.id}/reshare`, { method: 'POST' });
    post.reshares_count = (post.reshares_count || 0) + 1;
    toast('Reshared', 'success');
    updatePostCard(post);
  } catch (err) { toast(err.message, 'error'); }
}
function updatePostCard(post) {
  const old = document.querySelector(`[data-post-id="${post.id}"]`);
  if (!old) return;
  old.replaceWith(renderPost(post));
}

// ============ SHEET / MODAL ============
function openSheet(title, items, contentNode = null) {
  const container = $('#modalContainer');
  container.innerHTML = '';
  const overlay = el('div', { class: 'modal-overlay', onclick: (e) => { if (e.target === overlay) closeModal(); } });
  const content = el('div', { class: 'modal-content' });
  content.appendChild(el('div', { class: 'modal-handle' }));
  if (title) {
    const h = el('div', { class: 'modal-header' });
    h.appendChild(el('h3', {}, title));
    const cb = el('button', { class: 'btn-icon', onclick: closeModal });
    cb.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    h.appendChild(cb);
    content.appendChild(h);
  }
  const body = el('div', { class: 'modal-body', style: 'padding:8px 0;' });
  if (contentNode) body.appendChild(contentNode);
  if (items) {
    for (const item of items) {
      const btn = el('button', {
        style: `display:block;width:100%;text-align:left;padding:14px 20px;font-size:15px;background:none;color:${item.danger ? 'var(--danger)' : 'var(--text)'};`,
        onclick: () => { closeModal(); item.onClick && item.onClick(); }
      }, item.label);
      body.appendChild(btn);
    }
  }
  content.appendChild(body);
  overlay.appendChild(content);
  container.appendChild(overlay);
}
function closeModal() { $('#modalContainer').innerHTML = ''; }

// ============ POST MENU ============
function openPostMenu(post) {
  const items = [];
  if (CURRENT_USER && post.user.id === CURRENT_USER.id) {
    items.push({ label: 'Delete Post', danger: true, onClick: async () => {
      if (!confirm('Delete this post?')) return;
      try {
        await api(`/api/posts/${post.id}`, { method: 'DELETE' });
        toast('Deleted', 'success');
        CACHED_POSTS = CACHED_POSTS.filter(p => p.id !== post.id);
        renderFeed();
      } catch (err) { toast(err.message, 'error'); }
    }});
  }
  items.push({ label: 'Copy Link', onClick: () => {
    const url = `${API}/?post=${post.id}`;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Copied', 'success'));
    else toast(url, 'info');
  }});
  openSheet('Post Options', items);
}

  h.appendChild(closeBtn);
  content.appendChild(h);

  const textarea = el('textarea', {
    placeholder: "What's on your mind?", rows: 5,
    style: 'width:100%;background:var(--bg-3);border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-size:15px;color:var(--text);resize:none;font-family:inherit;',
    maxlength: 2000,

  const preview = el('div', { style: 'margin-top:12px;display:none;position:relative;border-radius:var(--radius);overflow:hidden;background:#000;' });
  body.appendChild(preview);
  let selectedFile = null;
  let previewURL = null;
  const fileInput = el('input', { type: 'file', style: 'display:none' });
  fileInput.addEventListener('change', () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    const maxMB = f.type.startsWith('video/') ? 50 : 5;
    if (f.size > maxMB * 1024 * 1024) {
      toast(`File too large. Max ${maxMB} MB.`, 'error');
      fileInput.value = '';
      return;
    }
    selectedFile = f;
    if (previewURL) URL.revokeObjectURL(previewURL);
    previewURL = URL.createObjectURL(f);
    preview.innerHTML = '';
    preview.style.display = 'block';

      preview.appendChild(el('video', { src: previewURL, controls: true, playsinline: true, style: 'width:100%;max-height:300px;display:block;' }));
    } else if (f.type.startsWith('image/')) {
      preview.appendChild(el('img', { src: previewURL, style: 'width:100%;max-height:300px;display:block;object-fit:contain;' }));
    } else {
      preview.appendChild(el('div', { style: 'padding:16px;text-align:center;color:var(--text);' }, '📎 ' + f.name));

      onclick: () => {

        if (previewURL) URL.revokeObjectURL(previewURL);

        preview.style.display = 'none';
      }

    rm.innerHTML = '<svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

  mediaActions.appendChild(photoBtn);
  const videoBtn = el('button', { class: 'btn btn-secondary', style: 'flex:1;padding:10px 6px;font-size:12px;', onclick: () => { fileInput.accept = 'video/*'; fileInput.click(); } });
  videoBtn.innerHTML = '<svg class="icon icon-sm" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg><span>Video</span>';
  mediaActions.appendChild(videoBtn);
  const fileBtn = el('button', { class: 'btn btn-secondary', style: 'flex:1;padding:10px 6px;font-size:12px;', onclick: () => { fileInput.accept = '*/*'; fileInput.click(); } });
  fileBtn.innerHTML = '<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg><span>File</span>';
  mediaActions.appendChild(fileBtn);
  body.appendChild(mediaActions);
  const postBtn = el('button', {
    class: 'btn btn-primary',
    style: 'margin-top:10px;',
    onclick: async () => {
      const caption = textarea.value.trim();
      if (!caption && !selectedFile) { toast('Add text or media', 'error'); return; }
      postBtn.disabled = true;
      postBtn.innerHTML = '<div class="loader"></div>';
      try {

        fd.append('caption', caption);
        if (selectedFile) fd.append('file', selectedFile);

async function openComments(post) {
  const container = $('#modalContainer');
  container.innerHTML = '';
  const overlay = el('div', { class: 'modal-overlay', onclick: (e) => { if (e.target === overlay) closeModal(); } });
  const content = el('div', { class: 'modal-content', style: 'height:85vh;display:flex;flex-direction:column;' });
  const h = el('div', { class: 'modal-header' });
  h.appendChild(el('h3', {}, `Comments (${post.comments_count || 0})`));
  const closeBtn = el('button', { class: 'btn-icon', onclick: closeModal });
  closeBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  h.appendChild(closeBtn);
  content.appendChild(h);
  const list = el('div', { style: 'flex:1;overflow-y:auto;padding:12px 16px;' });
  list.innerHTML = '<div style="text-align:center;padding:20px;"><div class="loader" style="margin:0 auto;"></div></div>';

  const form = el('form', {
    style: 'display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:var(--bg-2);',
    onsubmit: async (e) => {
      e.preventDefault();
      const inp = form.querySelector('input');
      const text = inp.value.trim();
      if (!text) return;
      const submitBtn = form.querySelector('button');
      submitBtn.disabled = true;
      try {
        const res = await api(`/api/posts/${post.id}/comments`, { method: 'POST', body: JSON.stringify({ text }) });
        inp.value = '';
        post.comments_count = (post.comments_count || 0) + 1;
        renderSingleComment(res.comment, list);
        updatePostCard(post);
      } catch (err) { toast(err.message, 'error'); }
      submitBtn.disabled = false;
    },
  });
  const inp = el('input', { type: 'text', placeholder: 'Add a comment...', maxlength: 2000, style: 'flex:1;padding:10px 14px;background:var(--bg-3);border:1px solid var(--border);border-radius:20px;font-size:14px;color:var(--text);' });
  form.appendChild(inp);
  const sendBtn = el('button', { type: 'submit', class: 'btn-icon', style: 'background:var(--accent);color:white;width:40px;height:40px;border-radius:50%;' });
  sendBtn.innerHTML = '<svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
  form.appendChild(sendBtn);
  content.appendChild(form);
  overlay.appendChild(content);
  container.appendChild(overlay);
  try {
    const data = await api(`/api/posts/${post.id}/comments`);
    list.innerHTML = '';
    if (!data.comments || data.comments.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-2);font-size:14px;">No comments yet. Be the first!</div>';
    } else {
      for (const c of data.comments) renderSingleComment(c, list);
    }
  } catch (err) {
    list.innerHTML = `<div style="text-align:center;padding:20px;color:var(--danger);">${esc(err.message)}</div>`;
  }
}
function renderSingleComment(c, list) {
  const row = el('div', { style: 'display:flex;gap:10px;margin-bottom:16px;' });
  row.appendChild(avatarEl(c.user, 36));
  const right = el('div', { style: 'flex:1;min-width:0;' });

  row.appendChild(right);
  list.appendChild(row);
  list.scrollTop = list.scrollHeight;
}

// ============ PROFILE ============
async function openProfile(userId) {
  const main = $('#appMain');
  main.innerHTML = '<div style="display:flex;justify-content:center;padding:40px;"><div class="loader loader-lg"></div></div>';
  switchView('profile');
  try {
    const data = await api(`/api/users/${userId}`);
    const u = data.user;
    main.innerHTML = '';
    const cover = el('div', { style: 'height:120px;background:linear-gradient(135deg,var(--accent),var(--accent-2));' });
    main.appendChild(cover);
    const info = el('div', { style: 'padding:0 16px 16px;margin-top:-50px;position:relative;' });
    const av = avatarEl(u, 100);
    av.style.border = '4px solid var(--bg)';
    info.appendChild(av);
    info.appendChild(el('div', { style: 'font-size:20px;font-weight:700;margin-top:8px;' }, u.name));
    if (u.username) info.appendChild(el('div', { style: 'font-size:14px;color:var(--text-2);' }, '@' + u.username));
    if (u.bio) info.appendChild(el('div', { style: 'font-size:14px;line-height:1.5;margin-top:12px;' }, u.bio));
    if (u.location) info.appendChild(el('div', { style: 'font-size:13px;color:var(--text-2);margin-top:8px;' }, '📍 ' + u.location));
    const stats = el('div', { style: 'display:flex;gap:24px;margin-top:16px;' });
    [
      { label: 'Posts', value: u.posts_count || 0 },
      { label: 'Followers', value: u.followers_count || 0 },
      { label: 'Following', value: u.following_count || 0 },
    ].forEach(s => {
      const box = el('div');
      box.appendChild(el('div', { style: 'font-weight:700;font-size:16px;' }, String(s.value)));
      box.appendChild(el('div', { style: 'font-size:12px;color:var(--text-3);' }, s.label));
      stats.appendChild(box);
    });
    info.appendChild(stats);
    const actions = el('div', { style: 'display:flex;gap:8px;margin-top:16px;' });
    if (CURRENT_USER && u.id === CURRENT_USER.id) {
      const editBtn = el('button', { class: 'btn btn-secondary', style: 'flex:1;', onclick: () => openEditProfile() }, 'Edit Profile');
      actions.appendChild(editBtn);
    } else {
      const followBtn = el('button', {
        class: 'btn ' + (u.is_following ? 'btn-secondary' : 'btn-primary'),
        style: 'flex:1;',
        onclick: async () => {
          try {
            if (u.is_following) {
              await api(`/api/users/${u.id}/follow`, { method: 'DELETE' });
              u.is_following = false;
              u.followers_count = Math.max(0, (u.followers_count || 1) - 1);
            } else {
              await api(`/api/users/${u.id}/follow`, { method: 'POST' });
              u.is_following = true;
              u.followers_count = (u.followers_count || 0) + 1;
            }
            openProfile(u.id);
          } catch (err) { toast(err.message, 'error'); }
        }
      }, el('span', {}, u.is_following ? 'Following' : 'Follow'));
      actions.appendChild(followBtn);
      const msgBtn = el('button', { class: 'btn btn-secondary', style: 'flex:0 0 auto;width:auto;padding:14px;' });
      msgBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
      msgBtn.addEventListener('click', () => openChatWith(u));
      actions.appendChild(msgBtn);
    }
    info.appendChild(actions);
    main.appendChild(info);
    main.appendChild(el('div', { style: 'padding:12px 16px;border-top:1px solid var(--border);font-weight:600;font-size:14px;' }, 'Posts'));
    const postsWrap = el('div');
    main.appendChild(postsWrap);
    try {
      const pdata = await api(`/api/users/${u.id}/posts`);
      if (!pdata.posts || pdata.posts.length === 0) {
        postsWrap.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-2);font-size:14px;">No posts yet</div>';
      } else {
        for (const p of pdata.posts) postsWrap.appendChild(renderPost(p));
      }
    } catch (err) {
      postsWrap.innerHTML = `<div style="padding:20px;text-align:center;color:var(--danger);">${esc(err.message)}</div>`;
    }
  } catch (err) {
    main.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-2);">${esc(err.message)}</div>`;
  }
}

// ============ EDIT PROFILE ============
function openEditProfile() {
  const container = $('#modalContainer');
  container.innerHTML = '';
  const overlay = el('div', { class: 'modal-overlay', onclick: (e) => { if (e.target === overlay) closeModal(); } });
  const content = el('div', { class: 'modal-content' });
  const h = el('div', { class: 'modal-header' });
  h.appendChild(el('h3', {}, 'Edit Profile'));
  const cb = el('button', { class: 'btn-icon', onclick: closeModal });
  cb.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  h.appendChild(cb);
  content.appendChild(h);
  const body = el('div', { class: 'modal-body' });
  const avatarSection = el('div', { style: 'text-align:center;margin-bottom:20px;' });
  const avatarPreview = el('div', {
    style: 'width:100px;height:100px;margin:0 auto;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:40px;position:relative;cursor:pointer;border:3px solid var(--border);',
    onclick: () => avatarInput.click(),
  });
  function setAvatarPreview(src) {
    avatarPreview.innerHTML = '';
    if (src) {
      avatarPreview.appendChild(el('img', { src, style: 'width:100%;height:100%;object-fit:cover;' }));
    } else {
      avatarPreview.textContent = initials(CURRENT_USER.name);
    }
  }
  setAvatarPreview(CURRENT_USER.avatar);
  const cameraBadge = el('div', { style: 'position:absolute;bottom:0;right:0;background:var(--accent);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);' });
  cameraBadge.innerHTML = '<svg class="icon icon-sm" viewBox="0 0 24 24" style="stroke:white;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
  avatarPreview.appendChild(cameraBadge);
  avatarSection.appendChild(avatarPreview);
  const changePhotoText = el('div', { style: 'margin-top:10px;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;', onclick: () => avatarInput.click() }, 'Change Profile Picture');
  avatarSection.appendChild(changePhotoText);
  const avatarInput = el('input', { type: 'file', accept: 'image/*', style: 'display:none' });
  avatarInput.addEventListener('change', async () => {
    const f = avatarInput.files && avatarInput.files[0];
    if (!f) return;
    if (f.size > 2 * 1024 * 1024) { toast('Avatar too large (max 2 MB)', 'error'); avatarInput.value = ''; return; }
    if (!f.type.startsWith('image/')) { toast('Avatar must be an image', 'error'); avatarInput.value = ''; return; }
    const reader = new FileReader();
    reader.onload = (ev) => setAvatarPreview(ev.target.result);
    reader.readAsDataURL(f);
    const fd = new FormData();
    fd.append('file', f);
    changePhotoText.textContent = 'Uploading...';
    changePhotoText.style.color = 'var(--text-3)';
    try {
      const res = await api('/api/profile/avatar', { method: 'POST', body: fd });
      toast('Profile picture updated!', 'success');
      CURRENT_USER.avatar = res.avatar;
      changePhotoText.textContent = 'Change Profile Picture';
      changePhotoText.style.color = 'var(--accent)';
    } catch (err) {
      toast(err.message, 'error');
      setAvatarPreview(CURRENT_USER.avatar);
      changePhotoText.textContent = 'Change Profile Picture';
      changePhotoText.style.color = 'var(--accent)';
    }
  });
  avatarSection.appendChild(avatarInput);
  body.appendChild(avatarSection);
  const fields = [
    { key: 'name', label: 'Name', value: CURRENT_USER.name || '' },
    { key: 'username', label: 'Username', value: CURRENT_USER.username || '' },
    { key: 'bio', label: 'Bio', value: CURRENT_USER.bio || '', multiline: true },
    { key: 'location', label: 'Location', value: CURRENT_USER.location || '' },
  ];
  const inputs = {};
  for (const f of fields) {
    const wrap = el('div', { class: 'field', style: 'margin-bottom:12px;' });
    wrap.appendChild(el('label', {}, f.label));
    const inpWrap = el('div', { class: 'input-wrap no-icon' });
    const inp = f.multiline
      ? el('textarea', { rows: 3, style: 'padding:12px;resize:none;' })
      : el('input', { type: 'text' });
    inp.value = f.value;
    inpWrap.appendChild(inp);
    wrap.appendChild(inpWrap);
    body.appendChild(wrap);
    inputs[f.key] = inp;
  }
  const saveBtn = el('button', {
    class: 'btn btn-primary',
    style: 'margin-top:8px;',
    onclick: async () => {
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<div class="loader"></div>';
      try {
        await api('/api/profile', {
          method: 'PATCH',
          body: JSON.stringify({
            name: inputs.name.value.trim(),
            username: inputs.username.value.trim() || null,
            bio: inputs.bio.value.trim(),
            location: inputs.location.value.trim(),
          }),
        });
        toast('Profile saved', 'success');
        await loadMe();
        closeModal();
        openProfile(CURRENT_USER.id);
      } catch (err) {
        toast(err.message, 'error');
        saveBtn.disabled = false;
        saveBtn.innerHTML = 'Save Changes';
      }
    }
  }, el('span', {}, 'Save Changes'));
  body.appendChild(saveBtn);
  content.appendChild(body);
  overlay.appendChild(content);
  container.appendChild(overlay);
}

function appendMessage(m) {
  const msgsWrap = $('#msgsWrap');
  if (!msgsWrap) return;
  const mine = CURRENT_USER && m.sender_id === CURRENT_USER.id;
  const row = el('div', { style: `display:flex;justify-content:${mine ? 'flex-end' : 'flex-start'};` });
  const bubble = el('div', {
    style: `max-width:75%;padding:8px 12px;border-radius:16px;font-size:14px;line-height:1.4;word-break:break-word;background:${mine ? 'var(--accent)' : 'var(--bg-3)'};color:${mine ? 'white' : 'var(--text)'};`
  });
  if (m.media && m.media_type === 'voice') {
    bubble.appendChild(el('audio', { src: m.media, controls: true, style: 'max-width:220px;' }));
    if (m.duration_seconds) {
      bubble.appendChild(el('div', { style: 'font-size:11px;opacity:.7;margin-top:4px;' }, m.duration_seconds + 's'));
    }
  } else if (m.media && m.media_type === 'image') {
    bubble.appendChild(el('img', { src: m.media, style: 'max-width:100%;border-radius:8px;margin-bottom:4px;' }));
    if (m.text) bubble.appendChild(el('div', {}, m.text));
  } else if (m.media && m.media_type === 'video') {
    bubble.appendChild(el('video', { src: m.media, controls: true, style: 'max-width:220px;border-radius:8px;' }));
    if (m.text) bubble.appendChild(el('div', {}, m.text));
  } else if (m.media) {
    const a = el('a', { href: m.media, download: 'file', style: 'color:inherit;text-decoration:underline;' }, '📎 Download file');

  bubble.appendChild(el('div', { style: `font-size:10px;opacity:.7;margin-top:4px;text-align:${mine ? 'right' : 'left'};` }, timeAgo(m.created_at)));

function pickChatFile(otherId, accept) {
  const inp = el('input', { type: 'file', accept, style: 'display:none' });
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    let maxMB = 25;
    if (f.type.startsWith('video/')) maxMB = 50;
    else if (f.type.startsWith('image/')) maxMB = 10;
    else if (f.type.startsWith('audio/')) maxMB = 15;
    if (f.size > maxMB * 1024 * 1024) {
      toast('File too large. Max ' + maxMB + ' MB', 'error');
      inp.value = '';
      return;
    }
    const msgsWrap = $('#msgsWrap');
    let uploadingBubble = null;
    if (msgsWrap) {
      uploadingBubble = el('div', { style: 'display:flex;justify-content:flex-end;' });
      const b = el('div', { style: 'max-width:75%;padding:8px 12px;border-radius:16px;background:var(--accent);color:white;font-size:14px;opacity:.7;' }, '📤 Uploading...');
      uploadingBubble.appendChild(b);
      msgsWrap.appendChild(uploadingBubble);
      msgsWrap.scrollTop = msgsWrap.scrollHeight;
    }
    const fd = new FormData();
    fd.append('receiver_id', otherId);
    fd.append('text', '');
    fd.append('file', f);
    try {
      const res = await api('/api/messages/file', { method: 'POST', body: fd });
      if (uploadingBubble) uploadingBubble.remove();
      appendMessage(res.message);
    } catch (err) {
      if (uploadingBubble) uploadingBubble.remove();
      toast(err.message, 'error');
    }
  });
  document.body.appendChild(inp);
  inp.click();
  setTimeout(() => inp.remove(), 1000);
}

async function recordVoice(otherId) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('Recording not supported on this browser', 'error');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const recorder = new MediaRecorder(stream);
    const chunks = [];
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: 'audio/webm' });
      if (blob.size > 15 * 1024 * 1024) { toast('Voice too large (max 15 MB)', 'error'); return; }
      const fd = new FormData();
      fd.append('receiver_id', otherId);
      fd.append('duration_seconds', '0');
      fd.append('file', blob, 'voice.webm');
      try {
        const res = await api('/api/messages/voice', { method: 'POST', body: fd });
        appendMessage(res.message);
      } catch (err) { toast(err.message, 'error'); }
    };
    recorder.start();
    const maxTimer = setTimeout(() => recorder.stop(), 30000);
    const container = $('#modalContainer');
    container.innerHTML = '';
    const overlay = el('div', { class: 'modal-overlay', onclick: () => { clearTimeout(maxTimer); if (recorder.state !== 'inactive') recorder.stop(); closeModal(); } });
    const content = el('div', { class: 'modal-content', style: 'text-align:center;padding:32px 20px;' });
    content.appendChild(el('div', { style: 'font-size:20px;font-weight:700;margin-bottom:16px;' }, '🎙️ Recording...'));
    content.appendChild(el('div', { style: 'color:var(--text-2);font-size:14px;margin-bottom:24px;' }, 'Tap stop when done (max 30s)'));
    const stopBtn = el('button', {
      class: 'btn btn-danger',
      style: 'max-width:200px;margin:0 auto;',
      onclick: () => { clearTimeout(maxTimer); if (recorder.state !== 'inactive') recorder.stop(); closeModal(); }
    }, 'Stop & Send');
    content.appendChild(stopBtn);
    overlay.appendChild(content);
    container.appendChild(overlay);
  } catch (err) {
    toast('Mic permission denied', 'error');
  }
}

// ============ STORIES: VIEWER + CREATOR ============
function openStoryViewer(group) {
  const container = $('#modalContainer');
  container.innerHTML = '';
  const overlay = el('div', {
    style: 'position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;user-select:none;',
  });

  let idx = 0;
  const total = group.statuses.length;
  let progressTimer = null;
  let currentProgressBar = null;
  let isPaused = false;
  const STORY_DURATION = 5000; // 5 seconds default per story

  function clearTimer() {
    if (progressTimer) {
      clearInterval(progressTimer);
      progressTimer = null;
    }
  }

  function render() {
    clearTimer();
    overlay.innerHTML = '';
    isPaused = false;
    const s = group.statuses[idx];

    // ===== PROGRESS BARS =====
    const progressWrap = el('div', {
      style: 'position:absolute;top:8px;left:8px;right:8px;height:3px;z-index:10;display:flex;gap:3px;',
    });
    const bars = [];
    for (let i = 0; i < total; i++) {
      const bar = el('div', {
        style: 'flex:1;height:100%;background:rgba(255,255,255,0.3);border-radius:2px;overflow:hidden;',
      });
      const fill = el('div', {
        style: `height:100%;background:white;width:${i < idx ? '100%' : '0%'};transition:width 0.1s linear;`,
      });
      bar.appendChild(fill);
      progressWrap.appendChild(bar);
      bars.push(fill);
    }
    overlay.appendChild(progressWrap);
    currentProgressBar = bars[idx];

    // ===== HEADER =====
    const header = el('div', {
      style: 'position:absolute;top:20px;left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:10;',
    });
    if (group.user.avatar) {
      header.appendChild(el('img', { src: group.user.avatar, style: 'width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid white;' }));
    } else {
      header.appendChild(el('div', {
        style: 'width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:14px;border:2px solid white;',
      }, initials(group.user.name)));
    }
    const info = el('div', { style: 'flex:1;color:white;' });
    info.appendChild(el('div', { style: 'font-weight:700;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,0.7);' }, group.user.name));
    info.appendChild(el('div', { style: 'font-size:11px;opacity:0.9;text-shadow:0 1px 3px rgba(0,0,0,0.7);' }, timeAgo(s.created_at)));
    header.appendChild(info);

    if (CURRENT_USER && group.user.id === CURRENT_USER.id) {
      const delBtn = el('button', {
        style: 'background:rgba(0,0,0,0.5);color:white;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;',
        onclick: async (e) => {
          e.stopPropagation();
          if (!confirm('Delete this story?')) return;
          try {
            await api(`/api/statuses/${s.id}`, { method: 'DELETE' });
            toast('Deleted', 'success');
            clearTimer();
            closeModal();
            loadFeed('all');
          } catch (err) { toast(err.message, 'error'); }
        }
      });
      delBtn.innerHTML = '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>';
      header.appendChild(delBtn);
    }

    const closeBtn = el('button', {
      style: 'background:rgba(0,0,0,0.5);color:white;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;',
      onclick: () => { clearTimer(); closeModal(); },
    });
    closeBtn.innerHTML = '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    header.appendChild(closeBtn);
    overlay.appendChild(header);

    // ===== CONTENT =====
    const content = el('div', {
      style: 'flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;',
    });

    if (s.media_type === 'video') {
      const video = el('video', {
        src: s.media,
        autoplay: true,
        playsinline: true,
        muted: true,
        loop: false,
        style: 'max-width:100%;max-height:100%;object-fit:contain;',
      });
      content.appendChild(video);
      video.addEventListener('loadedmetadata', () => {
        if (video.duration && video.duration < 60) {
          startProgress(video.duration * 1000);
        } else {
          startProgress(STORY_DURATION);
        }
      });
      // Fallback if metadata fails
      setTimeout(() => {
        if (!video.duration) startProgress(STORY_DURATION);
      }, 500);
    } else if (s.media) {
      const img = el('img', {
        src: s.media,
        style: 'max-width:100%;max-height:100%;object-fit:contain;',
      });
      content.appendChild(img);
      startProgress(STORY_DURATION);
    } else {
      startProgress(STORY_DURATION);
    }

    // Story text caption
    if (s.text) {
      content.appendChild(el('div', {
        style: 'position:absolute;bottom:80px;left:20px;right:20px;text-align:center;color:white;font-size:18px;font-weight:600;text-shadow:0 2px 6px rgba(0,0,0,0.9);padding:12px;background:rgba(0,0,0,0.4);border-radius:12px;backdrop-filter:blur(4px);',
      }, s.text));
    }

    // Music info (if story has music)
    if (s.music_title) {
      content.appendChild(el('div', {
        style: 'position:absolute;bottom:20px;left:20px;right:20px;display:flex;align-items:center;gap:8px;color:white;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,0.9);background:rgba(0,0,0,0.4);padding:8px 12px;border-radius:20px;width:fit-content;margin:0 auto;backdrop-filter:blur(4px);',
      }, el('span', {}, '🎵'), el('span', { style: 'font-weight:600;' }, s.music_title)));
    }

    overlay.appendChild(content);

    // ===== TAP ZONES =====
    const tapLeft = el('div', {
      style: 'position:absolute;top:0;left:0;width:50%;height:100%;z-index:5;',
      onclick: () => {
        clearTimer();
        if (idx > 0) { idx--; render(); }
        else closeModal();
      }
    });
    const tapRight = el('div', {
      style: 'position:absolute;top:0;right:0;width:50%;height:100%;z-index:5;',
      onclick: () => {
        clearTimer();
        if (idx < total - 1) { idx++; render(); }
        else closeModal();
      }
    });
    overlay.appendChild(tapLeft);
    overlay.appendChild(tapRight);

    // ===== PAUSE ON HOLD =====
    let holdTimer = null;
    let wasPaused = false;

    function startHold(e) {
      wasPaused = isPaused;
      holdTimer = setTimeout(() => {
        isPaused = true;
        if (progressTimer) clearInterval(progressTimer);
        // Pause video
        const v = overlay.querySelector('video');
        if (v) v.pause();
        const a = overlay.querySelector('audio');
        if (a) a.pause();
      }, 200);
    }
    function endHold(e) {
      clearTimeout(holdTimer);
      if (isPaused && !wasPaused) {
        isPaused = false;
        resumeProgress();
        const v = overlay.querySelector('video');
        if (v) v.play().catch(() => {});
        const a = overlay.querySelector('audio');
        if (a) a.play().catch(() => {});
      }
    }
    overlay.addEventListener('mousedown', startHold);
    overlay.addEventListener('touchstart', startHold, { passive: true });
    overlay.addEventListener('mouseup', endHold);
    overlay.addEventListener('touchend', endHold);
    overlay.addEventListener('mouseleave', endHold);
    overlay.addEventListener('touchcancel', endHold);

    // ===== BACKGROUND AUDIO (music) =====
    if (s.music_url) {
      const audio = el('audio', {
        src: s.music_url,
        autoplay: true,
        loop: true,
        style: 'display:none;',
      });
      overlay.appendChild(audio);
      audio.play().catch(() => {});
    }

    container.appendChild(overlay);
  }

  let currentProgressValue = 0;
  let currentProgressDuration = 5000;
  let progressStartTime = 0;
  let progressPausedAt = 0;

  function startProgress(durationMs) {
    currentProgressValue = 0;
    currentProgressDuration = durationMs;
    progressStartTime = Date.now();
    progressPausedAt = 0;
    clearTimer();
    progressTimer = setInterval(() => {
      if (isPaused) return;
      const elapsed = Date.now() - progressStartTime - progressPausedAt;
      const pct = Math.min(100, (elapsed / currentProgressDuration) * 100);
      if (currentProgressBar) {
        currentProgressBar.style.width = pct + '%';
      }
      if (pct >= 100) {
        clearTimer();
        // Auto advance
        if (idx < total - 1) {
          idx++;
          render();
        } else {
          closeModal();
        }
      }
    }, 50);
  }

  function resumeProgress() {
    if (progressPausedAt) {
      progressStartTime += Date.now() - progressPausedAt;
      progressPausedAt = 0;
    }
  }

  render();
  }

  const postBtn = el('button', {

}

function handleNav(view) {
  if (view === 'home') loadFeed('all');
  else if (view === 'discovery') openDiscovery();
  else if (view === 'chats') openChats();
  else if (view === 'profile') {
    if (CURRENT_USER) openProfile(CURRENT_USER.id);
  }
  }

$$('.nav-item').forEach(item => {
  item.addEventListener('click', () => handleNav(item.dataset.view));
});

// ============ START APP ============
async function startApp() {
  showApp();
  await loadFeed('all');
}

// ============ INIT WITH SPLASH SCREEN ============
async function init() {
  try {
    initTheme();
    console.log('[MSAFIRI] Init starting...');

    TOKEN = getSavedToken();

    if (TOKEN) {
      console.log('[MSAFIRI] Token found, auto-login...');
      try {
        await loadMe();
        console.log('[MSAFIRI] Auto-login success:', CURRENT_USER.name);
        // Wait 6 seconds for splash animation, then show app
        setTimeout(async () => {
          await startApp();
        }, 6000);
        return;
      } catch (err) {
        console.warn('[MSAFIRI] Auto-login failed:', err.message);
        TOKEN = null;
        CURRENT_USER = null;
        localStorage.removeItem('msafiri_token');
        try { sessionStorage.removeItem('msafiri_token'); } catch(e) {}
      }
    }

    console.log('[MSAFIRI] Showing auth screen after splash');
    // Wait 6 seconds for splash animation, then show auth
    setTimeout(() => {
      showAuth();
    }, 6000);

  } catch (err) {
    console.error('[MSAFIRI] FATAL:', err);
    setTimeout(() => showAuth(), 6000);
  }
}

document.addEventListener('DOMContentLoaded', init);

// Keep session alive - ping every 5 minutes
setInterval(() => {
  if (TOKEN) {
    api('/api/me').catch(() => {
      console.warn('[MSAFIRI] Ping failed');
    });
  }
}, 5 * 60 * 1000);

// App resume from background
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && TOKEN && !CURRENT_USER) {
    console.log('[MSAFIRI] App resumed, reloading...');
    init();
  }
});

// ============================================================
// SPLASH SCREEN TIMER (fallback)
// ============================================================
// Baada ya sekunde 6, hakikisha splash imefutwa
setTimeout(() => {
  const sp = document.getElementById('splashScreen');
  if (sp && !sp.classList.contains('fade-out')) {
    console.warn('[MSAFIRI] Splash timeout fallback');
    sp.classList.add('fade-out');
    // If neither auth nor app shown, show auth
    const authHidden = document.getElementById('authScreen')?.classList.contains('hidden');
    const appHidden = document.getElementById('appScreen')?.classList.contains('hidden');
    if (authHidden && appHidden) {
      document.getElementById('authScreen')?.classList.remove('hidden');
    }
  }
}, 6500);
</script>
