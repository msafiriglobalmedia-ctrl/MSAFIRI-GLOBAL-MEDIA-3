<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050817">
<meta name="description" content="MSAFIRI GLOBAL MEDIA V4">
<title>MSAFIRI GLOBAL MEDIA V4</title>

<style>
:root{
  --bg:#050817;
  --card:#0b1227;
  --card2:#101a34;
  --line:#243252;
  --text:#f4f7ff;
  --muted:#9ca8c7;
  --accent:#ff8a00;
  --accent2:#ff4d3d;
  --green:#20d37a;
  --danger:#ff4d5e;
  --blue:#3d8bff;
  --shadow:0 10px 30px rgba(0,0,0,.25);
  --radius:18px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100vh;
}

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top left,rgba(255,138,0,.12),transparent 35%),
    radial-gradient(circle at bottom right,rgba(61,139,255,.12),transparent 35%),
    var(--bg);
}

.auth-card{
  width:min(430px,100%);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:25px;
  box-shadow:var(--shadow);
}

.brand{
  text-align:center;
  margin-bottom:25px;
}

.brand-logo{
  width:68px;
  height:68px;
  margin:auto;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:900;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
}

.brand h1{
  margin:14px 0 5px;
  font-size:25px;
}

.brand p{
  margin:0;
  color:var(--muted);
  font-size:13px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.tab{
  flex:1;
  border:1px solid var(--line);
  background:var(--card2);
  color:var(--muted);
  padding:11px;
  border-radius:12px;
}

.tab.active{
  color:white;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-color:transparent;
}

.form{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.input,
.textarea{
  width:100%;
  border:1px solid var(--line);
  outline:none;
  background:#071025;
  color:white;
  border-radius:12px;
  padding:13px 14px;
}

.textarea{
  resize:vertical;
  min-height:90px;
}

.input:focus,
.textarea:focus{
  border-color:var(--accent);
}

.primary{
  border:0;
  color:white;
  padding:13px 16px;
  border-radius:12px;
  font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.secondary{
  border:1px solid var(--line);
  color:white;
  background:var(--card2);
  padding:11px 14px;
  border-radius:12px;
}

.danger{
  border:1px solid rgba(255,77,94,.4);
  color:#ff7c89;
  background:rgba(255,77,94,.08);
  padding:11px 14px;
  border-radius:12px;
}

.small{
  font-size:12px;
}

.muted{
  color:var(--muted);
}

.app-shell{
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:62px;
  background:rgba(5,8,23,.96);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}

.top-brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
}

.top-logo{
  width:38px;
  height:38px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:900;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--card2);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.main{
  width:min(1100px,100%);
  margin:auto;
  padding:15px 15px 85px;
}

.view{
  display:none;
}

.view.active{
  display:block;
}

.section-title{
  font-size:21px;
  margin:5px 0 15px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.create-post{
  padding:15px;
  margin-bottom:15px;
}

.create-top{
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#1c2948;
  border:1px solid var(--line);
  flex:none;
}

.avatar.big{
  width:80px;
  height:80px;
}

.avatar.small{
  width:38px;
  height:38px;
}

.post-input{
  flex:1;
  background:#071025;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
  color:var(--muted);
  cursor:text;
  min-height:50px;
}

.file-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.file-btn{
  border:1px solid var(--line);
  background:var(--card2);
  color:white;
  border-radius:11px;
  padding:9px 12px;
}

.file-name{
  color:var(--muted);
  font-size:12px;
  padding:9px 3px;
}

.post{
  padding:15px;
  margin-bottom:14px;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-user{
  flex:1;
}

.post-user strong{
  display:block;
  font-size:14px;
}

.post-user span{
  color:var(--muted);
  font-size:11px;
}

.post-caption{
  margin:13px 0;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.post-media{
  width:100%;
  max-height:600px;
  object-fit:contain;
  background:#03050d;
  border-radius:14px;
  border:1px solid var(--line);
}

.post-actions{
  display:flex;
  gap:5px;
  margin-top:10px;
  overflow-x:auto;
}

.action{
  flex:1;
  min-width:65px;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:9px 5px;
  border-radius:10px;
}

.action:hover{
  background:var(--card2);
  color:white;
}

.action.liked{
  color:#ff6474;
}

.comments{
  margin-top:10px;
  border-top:1px solid var(--line);
  padding-top:10px;
}

.comment{
  display:flex;
  gap:8px;
  margin-bottom:9px;
}

.comment-body{
  background:var(--card2);
  border-radius:12px;
  padding:8px 10px;
  flex:1;
  font-size:13px;
}

.comment-form{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.comment-form input{
  flex:1;
}

.bottom-nav{
  position:fixed;
  z-index:100;
  bottom:0;
  left:0;
  right:0;
  height:66px;
  background:rgba(5,8,23,.98);
  border-top:1px solid var(--line);
  display:flex;
  justify-content:center;
}

.bottom-inner{
  width:min(600px,100%);
  display:flex;
}

.nav-btn{
  flex:1;
  border:0;
  background:transparent;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:11px;
}

.nav-btn span:first-child{
  font-size:20px;
}

.nav-btn.active{
  color:white;
}

.chat-layout{
  display:grid;
  grid-template-columns:330px 1fr;
  min-height:calc(100vh - 100px);
  gap:12px;
}

.chat-list{
  overflow:hidden;
}

.chat-search{
  padding:12px;
  border-bottom:1px solid var(--line);
}

.chat-items{
  max-height:calc(100vh - 190px);
  overflow-y:auto;
}

.chat-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  border-bottom:1px solid rgba(36,50,82,.5);
  cursor:pointer;
}

.chat-item:hover,
.chat-item.active{
  background:var(--card2);
}

.chat-info{
  min-width:0;
  flex:1;
}

.chat-info strong{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-info small{
  color:var(--muted);
}

.chat-window{
  display:flex;
  flex-direction:column;
  min-height:calc(100vh - 100px);
  overflow:hidden;
}

.chat-header{
  height:64px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  border-bottom:1px solid var(--line);
  background:var(--card);
}

.chat-header-info{
  flex:1;
  min-width:0;
}

.chat-header-info strong{
  display:block;
}

.chat-header-info small{
  color:var(--green);
}

.chat-header-actions{
  display:flex;
  gap:4px;
}

.chat-header-actions .icon-btn{
  width:36px;
  height:36px;
  font-size:16px;
  border:0;
}

.messages{
  flex:1;
  min-height:350px;
  overflow-y:auto;
  padding:15px;
  background-size:cover;
  background-position:center;
}

.message{
  display:flex;
  margin-bottom:8px;
}

.message.mine{
  justify-content:flex-end;
}

.bubble{
  max-width:min(75%,520px);
  padding:9px 11px;
  border-radius:15px;
  background:#172442;
  overflow-wrap:anywhere;
}

.mine .bubble{
  background:#075e54;
}

.message-time{
  display:block;
  text-align:right;
  font-size:9px;
  color:#b8c3da;
  margin-top:3px;
}

.voice-message{
  display:flex;
  align-items:center;
  gap:8px;
}

.voice-message audio{
  max-width:210px;
  height:35px;
}

.chat-composer{
  padding:9px;
  display:flex;
  align-items:center;
  gap:7px;
  background:var(--card);
  border-top:1px solid var(--line);
}

.chat-composer input{
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  background:#071025;
  color:white;
  border-radius:22px;
  padding:11px 14px;
  outline:none;
}

.round-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--card2);
  color:white;
}

.send-btn{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:0;
}

.menu{
  position:fixed;
  z-index:300;
  right:15px;
  top:70px;
  width:240px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.menu button{
  width:100%;
  padding:13px;
  text-align:left;
  border:0;
  background:transparent;
  color:white;
}

.menu button:hover{
  background:var(--card2);
}

.modal-bg{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.72);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal{
  width:min(480px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.modal-head h3{
  margin:0;
}

.profile-card{
  padding:20px;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:15px;
}

.profile-info{
  flex:1;
}

.profile-info h2{
  margin:0 0 4px;
}

.profile-info p{
  margin:0;
  color:var(--muted);
}

.profile-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:18px;
}

.settings-list{
  margin-top:15px;
  overflow:hidden;
}

.setting{
  width:100%;
  padding:15px;
  background:transparent;
  color:white;
  border:0;
  border-bottom:1px solid var(--line);
  text-align:left;
}

.setting:last-child{
  border-bottom:0;
}

.call-screen{
  position:fixed;
  inset:0;
  z-index:800;
  background:#03050d;
  display:flex;
  flex-direction:column;
}

.call-top{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 15px;
  background:#070c1b;
}

.call-user{
  display:flex;
  align-items:center;
  gap:10px;
}

.call-videos{
  position:relative;
  flex:1;
  overflow:hidden;
  background:#02040a;
}

.remote-video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.local-video{
  position:absolute;
  right:12px;
  top:12px;
  width:120px;
  height:170px;
  object-fit:cover;
  border-radius:13px;
  background:#111;
  border:1px solid #3b4663;
}

.call-avatar{
  position:absolute;
  inset:0;
  margin:auto;
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
}

.call-status{
  position:absolute;
  left:0;
  right:0;
  bottom:25px;
  text-align:center;
  color:white;
}

.call-controls{
  min-height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  background:#070c1b;
}

.call-control{
  width:50px;
  height:50px;
  border-radius:50%;
  border:1px solid var(--line);
  background:#172039;
  color:white;
}

.call-end{
  background:#d92f43;
  border:0;
}

.empty{
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
}

.toast{
  position:fixed;
  z-index:1000;
  left:50%;
  bottom:82px;
  transform:translateX(-50%);
  background:#111b31;
  border:1px solid var(--line);
  color:white;
  padding:11px 15px;
  border-radius:12px;
  max-width:90%;
  text-align:center;
  display:none;
}

.search-results{
  margin-top:10px;
  max-height:300px;
  overflow:auto;
}

.search-user{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-bottom:1px solid var(--line);
}

.search-user button{
  margin-left:auto;
}

.preview{
  margin-top:10px;
  max-width:100%;
  max-height:300px;
  border-radius:12px;
}

@media(max-width:760px){
  .chat-layout{
    display:block;
  }

  .chat-list{
    display:block;
  }

  .chat-window{
    display:none;
  }

  .chat-layout.chat-open .chat-list{
    display:none;
  }

  .chat-layout.chat-open .chat-window{
    display:flex;
  }

  .chat-window{
    min-height:calc(100vh - 100px);
  }

  .chat-header{
    position:sticky;
    top:0;
    z-index:20;
  }

  .back-chat{
    display:flex!important;
  }

  .bubble{
    max-width:85%;
  }

  .main{
    padding-left:10px;
    padding-right:10px;
  }
}

@media(min-width:761px){
  .back-chat{
    display:none!important;
  }
}
</style>
</head>

<body>

<!-- AUTH -->
<section id="authView" class="auth">
  <div class="auth-card">

    <div class="brand">
      <div class="brand-logo">M</div>
      <h1>MSAFIRI GLOBAL MEDIA</h1>
      <p>Connect beyond boundaries.</p>
    </div>

    <div class="tabs">
      <button id="loginTab" class="tab active" onclick="showAuth('login')">Log In</button>
      <button id="registerTab" class="tab" onclick="showAuth('register')">Create Account</button>
    </div>

    <form id="loginForm" class="form" onsubmit="login(event)">
      <input id="loginEmail" class="input" type="email" placeholder="Email" required>
      <input id="loginPassword" class="input" type="password" placeholder="Password" required>
      <button class="primary" type="submit">Log In</button>
    </form>

    <form id="registerForm" class="form hidden" onsubmit="register(event)">
      <input id="regName" class="input" type="text" placeholder="Full name" required>
      <input id="regUsername" class="input" type="text" placeholder="Username" required>
      <input id="regEmail" class="input" type="email" placeholder="Email" required>
      <input id="regPassword" class="input" type="password" placeholder="Password" required minlength="6">
      <button class="primary" type="submit">Create Account</button>
    </form>

    <p id="authMessage" class="muted small" style="margin-top:12px;text-align:center"></p>
  </div>
</section>


<!-- MAIN APP -->
<section id="appView" class="app-shell hidden">

  <header class="topbar">
    <div class="top-brand">
      <div class="top-logo">M</div>
      <span>MSAFIRI GLOBAL MEDIA</span>
    </div>

    <button class="icon-btn" onclick="openProfile()">👤</button>
  </header>


  <main class="main">

    <!-- HOME -->
    <section id="homeView" class="view active">

      <h2 class="section-title">Home</h2>

      <div class="card create-post">

        <div class="create-top">
          <img id="createAvatar" class="avatar" src="" alt="avatar">

          <div id="postCaptionBox"
               class="post-input"
               onclick="openPostModal()">
            Unaweza kuandika nini leo?
          </div>
        </div>

        <div class="file-row">
          <button class="file-btn" onclick="openPostModal('image')">🖼️ Photo</button>
          <button class="file-btn" onclick="openPostModal('video')">🎥 Video</button>
          <button class="file-btn" onclick="openPostModal('audio')">🎵 Audio</button>
        </div>

      </div>

      <div id="feed"></div>

    </section>


    <!-- CHATS -->
    <section id="chatsView" class="view">

      <div id="chatLayout" class="chat-layout">

        <div class="card chat-list">

          <div class="chat-search">
            <input
              id="userSearch"
              class="input"
              placeholder="Search users..."
              oninput="searchUsers(this.value)">
            <div id="searchResults" class="search-results"></div>
          </div>

          <div id="chatItems" class="chat-items">
            <div class="empty">Hakuna chats bado.</div>
          </div>

        </div>


        <div class="card chat-window">

          <div id="noChatSelected" class="empty">
            <h3>Messages</h3>
            <p>Chagua mtu kuanza chat.</p>
          </div>


          <div id="chatContent" class="hidden" style="height:100%;display:flex;flex-direction:column">

            <div class="chat-header">

              <button
                class="icon-btn back-chat"
                onclick="closeChat()">
                ←
              </button>

              <img id="chatAvatar" class="avatar small" src="" alt="avatar">

              <div class="chat-header-info">
                <strong id="chatName">User</strong>
                <small id="chatStatus">online</small>
              </div>

              <div class="chat-header-actions">

                <button
                  class="icon-btn"
                  onclick="startCall('audio')"
                  title="Voice call">
                  📞
                </button>

                <button
                  class="icon-btn"
                  onclick="startCall('video')"
                  title="Video call">
                  🎥
                </button>

                <button
                  class="icon-btn"
                  onclick="toggleChatMenu()"
                  title="More">
                  ⋮
                </button>

              </div>

            </div>


            <div id="messages" class="messages"></div>


            <div class="chat-composer">

              <button
                class="round-btn"
                onclick="document.getElementById('chatFile').click()">
                📎
              </button>

              <input
                id="chatFile"
                type="file"
                class="hidden"
                onchange="sendChatFile(this.files[0])">

              <input
                id="messageInput"
                type="text"
                placeholder="Andika ujumbe..."
                onkeydown="if(event.key==='Enter')sendMessage()">

              <button
                id="recordBtn"
                class="round-btn"
                onclick="toggleRecording()">
                🎙️
              </button>

              <button
                class="round-btn send-btn"
                onclick="sendMessage()">
                ➤
              </button>

            </div>

          </div>

        </div>

      </div>

    </section>


    <!-- PROFILE -->
    <section id="profileView" class="view">

      <h2 class="section-title">Profile</h2>

      <div class="card profile-card">

        <div class="profile-head">

          <img id="profileAvatar" class="avatar big" src="" alt="profile">

          <div class="profile-info">
            <h2 id="profileName">User</h2>
            <p id="profileUsername">@username</p>
            <p id="profileBio"></p>
          </div>

        </div>

        <div class="profile-actions">

<!-- LiveKit browser client -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<script>

const API = "https://msafiri-global-media-3-1.onrender.com";

const TOKEN_KEY = "msafiri_token";

let TOKEN = localStorage.getItem(TOKEN_KEY) || "";
let ME = null;

let currentView = "home";
let currentChatUser = null;
let currentMessages = [];
let mediaRecorder = null;
let recordingChunks = [];
let recordingStream = null;

let callRoom = null;
let callId = null;
let callType = null;
let callMicTrack = null;
let callCameraTrack = null;
let callOtherUser = null;


/* =========================
   HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function fileURL(url){

  if(!url) return "";

  if(
    url.startsWith("http://") ||
    url.startsWith("https://") ||
    url.startsWith("blob:")
  ){
    return url;
  }

  return new URL(url, API).href;
}

function avatarURL(url){

  return fileURL(url) ||
    "https://ui-avatars.com/api/?name=User&background=172442&color=ffffff";
}

function toast(message){

  const t = $("toast");

  t.textContent = message;
  t.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    t.style.display = "none";
  },2600);
}

function closeModal(id){
  $(id).classList.add("hidden");
}

function authHeaders(json=false){

  const h = {};

  if(json){
    h["Content-Type"] = "application/json";
  }

  if(TOKEN){
    h["Authorization"] = "Bearer " + TOKEN;
  }

  return h;
}

async function api(path,options={}){

  options.headers = {
    ...authHeaders(),
    ...(options.headers || {})
  };

  const response = await fetch(API + path,options);

  let data = null;

  try{
    data = await response.json();
  }catch(e){
    data = {};
  }

  if(!response.ok){

    const message =
      data.detail ||
      data.message ||
      "Request failed";

    throw new Error(message);
  }

  return data;
}


/* =========================
   AUTH
========================= */

function showAuth(mode){

  const login = mode === "login";

  $("loginForm").classList.toggle("hidden",!login);
  $("registerForm").classList.toggle("hidden",login);

  $("loginTab").classList.toggle("active",login);
  $("registerTab").classList.toggle("active",!login);

  $("authMessage").textContent = "";
}


async function register(event){

  event.preventDefault();

  const payload = {
    name:$("regName").value.trim(),
    username:$("regUsername").value.trim(),
    email:$("regEmail").value.trim(),
    password:$("regPassword").value
  };

  try{

    $("authMessage").textContent = "Creating account...";

    const data = await api("/api/register",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(payload)
    });

    if(data.token){

      TOKEN = data.token;

      localStorage.setItem(TOKEN_KEY,TOKEN);

      await loadMe();
      openApp();

      toast("Account created successfully.");

    }else{

      $("authMessage").textContent =
        "Account created. Tafadhali login.";

      showAuth("login");
    }

  }catch(error){

    $("authMessage").textContent = error.message;
  }
}


async function login(event){

  event.preventDefault();

  try{

    $("authMessage").textContent = "Logging in...";

    const data = await api("/api/login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        email:$("loginEmail").value.trim(),
        password:$("loginPassword").value
      })
    });

    if(!data.token){
      throw new Error("Login token haijapatikana.");
    }

    TOKEN = data.token;

    localStorage.setItem(TOKEN_KEY,TOKEN);

    await loadMe();

    openApp();

    toast("Welcome back.");

  }catch(error){

    $("authMessage").textContent = error.message;
  }
}


async function loadMe(){

  ME = await api("/api/me");

  updateProfileUI();
}


function openApp(){

  $("authView").classList.add("hidden");
  $("appView").classList.remove("hidden");

  switchView("home");

  loadFeed();
  loadChats();
}


async function logout(){

  try{

    if(TOKEN){
      await api("/api/logout",{
        method:"POST"
      });
    }

  }catch(e){}

  TOKEN = "";
  ME = null;

  localStorage.removeItem(TOKEN_KEY);

  $("appView").classList.add("hidden");
  $("authView").classList.remove("hidden");

  showAuth("login");

  toast("Logged out.");
}


async function deleteAccount(){

  if(!confirm(
    "Una uhakika unataka kufuta account yako? Hatua hii itafuta access ya account."
  )){
    return;
  }

  try{

    await api("/api/account",{
      method:"DELETE"
    });

    TOKEN = "";
    ME = null;

    localStorage.removeItem(TOKEN_KEY);

    $("appView").classList.add("hidden");
    $("authView").classList.remove("hidden");

    toast("Account deleted.");

  }catch(error){

    toast(error.message);
  }
}


/* =========================
   VIEWS
========================= */

function switchView(view){

  currentView = view;

  document.querySelectorAll(".view")
    .forEach(v=>v.classList.remove("active"));

  document.querySelectorAll(".nav-btn")
    .forEach(v=>v.classList.remove("active"));

  if(view === "home"){

    $("homeView").classList.add("active");
    $("navHome").classList.add("active");

    loadFeed();

  }

  if(view === "chats"){

    $("chatsView").classList.add("active");
    $("navChats").classList.add("active");

    loadChats();

  }

  if(view === "profile"){

    $("profileView").classList.add("active");
    $("navProfile").classList.add("active");

    updateProfileUI();
  }
}


function openProfile(){

  switchView("profile");
}


/* =========================
   PROFILE
========================= */

function updateProfileUI(){

  if(!ME) return;

  const avatar = avatarURL(
    ME.avatar_url ||
    ME.profile_picture ||
    ME.avatar
  );

  $("createAvatar").src = avatar;
  $("profileAvatar").src = avatar;

  $("profileName").textContent =
    ME.name || ME.username || "User";

  $("profileUsername").textContent =
    ME.username ? "@" + ME.username : "";

  $("profileBio").textContent =
    ME.bio || "";

}


function openEditProfile(){

  if(!ME) return;

  $("editName").value = ME.name || "";
  $("editUsername").value = ME.username || "";
  $("editBio").value = ME.bio || "";

  $("editProfileModal").classList.remove("hidden");
}


async function saveProfile(){

  try{

    const data = await api("/api/profile",{
      method:"PATCH",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        name:$("editName").value.trim(),
        username:$("editUsername").value.trim(),
        bio:$("editBio").value.trim()
      })
    });

    ME = data.user || data;

    updateProfileUI();

    closeModal("editProfileModal");

    toast("Profile updated.");

  }catch(error){

    toast(error.message);
  }
}


async function changeAvatar(file){

  if(!file) return;

  try{

    const form = new FormData();

    form.append("file",file);

    const data = await api("/api/profile/avatar",{
      method:"POST",
      body:form
    });

    if(data.user){
      ME = data.user;
    }

    if(data.avatar_url){
      ME.avatar_url = data.avatar_url;
    }

    updateProfileUI();

    toast("Profile picture changed.");

  }catch(error){

    toast(error.message);
  }
}


function showMyPosts(){

  switchView("home");

  if(ME){
    loadFeed(ME.id);
  }
}


/* =========================
   FEED
========================= */

function openPostModal(type=""){

  $("postModal").classList.remove("hidden");

  $("postCaption").focus();

  if(type){

    $("postFile").accept =
      type === "image"
      ? "image/*"
      : type === "video"
      ? "video/*"
      : "audio/*";

    $("postFile").click();
  }
}


function previewPostFile(file){

  if(!file) return;

  $("postFileName").textContent = file.name;

  const preview = $("postPreview");

  preview.innerHTML = "";

  const url = URL.createObjectURL(file);

  if(file.type.startsWith("image/")){

    const img = document.createElement("img");

    img.src = url;
    img.className = "preview";

    preview.appendChild(img);

  }else if(file.type.startsWith("video/")){

    const video = document.createElement("video");

    video.src = url;
    video.controls = true;
    video.className = "preview";

    preview.appendChild(video);

  }else if(file.type.startsWith("audio/")){

    const audio = document.createElement("audio");

    audio.src = url;
    audio.controls = true;
    audio.style.width = "100%";

    preview.appendChild(audio);
  }
}


async function createPost(){

  try{

    const caption = $("postCaption").value.trim();
    const file = $("postFile").files[0];

    if(!caption && !file){

      toast("Andika caption au chagua media.");

      return;
    }

    const form = new FormData();

    form.append("caption",caption);

    if(file){
      form.append("file",file);
    }

    toast("Publishing...");

    await api("/api/posts",{
      method:"POST",
      body:form
    });

    $("postCaption").value = "";
    $("postFile").value = "";
    $("postFileName").textContent =
      "Hakuna file iliyochaguliwa";

    $("postPreview").innerHTML = "";

    closeModal("postModal");

    await loadFeed();

    toast("Post published.");

  }catch(error){

    toast(error.message);
  }
}


async function loadFeed(userId=null){

  try{

    const path =
      userId
      ? "/api/posts?user_id=" + encodeURIComponent(userId)
      : "/api/posts";

    const data = await api(path);

    const posts =
      Array.isArray(data)
      ? data
      : data.posts || [];

    renderFeed(posts);

  }catch(error){

    $("feed").innerHTML =
      `<div class="card empty">
        Imeshindikana kupakia feed.<br>
        <small>${escapeHTML(error.message)}</small>
      </div>`;
  }
}


function renderFeed(posts){

  if(!posts.length){

    $("feed").innerHTML =
      `<div class="card empty">
        Hakuna posts bado.
      </div>`;

    return;
  }

  $("feed").innerHTML =
    posts.map(renderPost).join("");
}


function renderPost(post){

  const user = post.user || {};

  const name =
    post.user_name ||
    user.name ||
    post.username ||
    user.username ||
    "User";

  const avatar =
    avatarURL(
      post.avatar_url ||
      user.avatar_url ||
      user.avatar
    );

  const caption =
    post.caption || "";

  const media =
    post.media_url ||
    post.file_url ||
    post.url ||
    "";

  const type =
    post.media_type ||
    post.file_type ||
    "";

  const postId = post.id;

  let mediaHTML = "";

  if(media){

    const url = fileURL(media);

    if(
      type.includes("image") ||
      /\.(jpg|jpeg|png|gif|webp)$/i.test(url)
    ){

      mediaHTML =
        `<img class="post-media"
          src="${escapeHTML(url)}"
          alt="post image"
          loading="lazy">`;

    }else if(
      type.includes("video") ||
      /\.(mp4|webm|mov)$/i.test(url)
    ){

      mediaHTML =
        `<video
          class="post-media"
          src="${escapeHTML(url)}"
          controls
          playsinline></video>`;

    }else if(
      type.includes("audio") ||
      /\.(mp3|wav|ogg|m4a)$/i.test(url)
    ){

      mediaHTML =
        `<audio
          src="${escapeHTML(url)}"
          controls
          style="width:100%;margin-top:10px"></audio>`;
    }
  }

  const liked =
    post.liked_by_me ||
    post.liked ||
    false;

  return `
  <article class="card post">

    <div class="post-head">

      <img
        class="avatar small"
        src="${escapeHTML(avatar)}"
        alt="avatar">

      <div class="post-user">
        <strong>${escapeHTML(name)}</strong>
        <span>${escapeHTML(
          post.created_at
          ? formatDate(post.created_at)
          : ""
        )}</span>
      </div>

    </div>

    ${
      caption
      ? `<div class="post-caption">
          ${escapeHTML(caption)}
         </div>`
      : ""
    }

    ${mediaHTML}

    <div class="post-actions">

      <button
        class="action ${liked ? "liked" : ""}"
        onclick="likePost('${postId}',this)">
        ❤️ ${post.likes_count || post.likes || 0}
      </button>

      <button
        class="action"
        onclick="toggleComments('${postId}')">
        💬 ${post.comments_count || post.comments || 0}
      </button>

      <button
        class="action"
        onclick="savePost('${postId}',this)">
        🔖 Save
      </button>

      <button
        class="action"
        onclick="resharePost('${postId}')">
        🔁 Share
      </button>

      <button
        class="action"
        onclick="reportPost('${postId}')">
        ⋮
      </button>

    </div>

    <div
      id="comments-${postId}"
      class="comments hidden">
    </div>

  </article>
  `;
}


function formatDate(value){

  try{

    return new Date(value).toLocaleString();

  }catch(e){

    return "";
  }
}


async function likePost(id,button){

  try{

    const data = await api(
      `/api/posts/${encodeURIComponent(id)}/like`,
      {method:"POST"}
    );

    if(data.liked !== undefined){

      button.classList.toggle("liked",data.liked);
    }

    const count =
      data.likes_count ??
      data.count ??
      "";

    if(count !== ""){
      button.innerHTML =
        `❤️ ${count}`;
    }

  }catch(error){

    toast(error.message);
  }
}


async function savePost(id,button){

  try{

    await api(
      `/api/posts/${encodeURIComponent(id)}/save`,
      {method:"POST"}
    );

    button.textContent = "🔖 Saved";

  }catch(error){

    toast(error.message);
  }
}


async function resharePost(id){

  try{

    await api(
      `/api/posts/${encodeURIComponent(id)}/reshare`,
      {method:"POST"}
    );

    toast("Post reshared.");

    loadFeed();

  }catch(error){

    toast(error.message);
  }
}


async function toggleComments(id){

  const box = $(`comments-${id}`);

  if(!box) return;

  box.classList.toggle("hidden");

  if(!box.classList.contains("hidden")){

    await loadComments(id);
  }
}


async function loadComments(id){

  const box = $(`comments-${id}`);

  try{

    const data = await api(
      `/api/posts/${encodeURIComponent(id)}/comments`
    );

    const comments =
      Array.isArray(data)
      ? data
      : data.comments || [];

    box.innerHTML = `

      <div>
        ${
          comments.length
          ? comments.map(c=>`

            <div class="comment">

              <div class="comment-body">

                <strong>
                  ${escapeHTML(
                    c.user_name ||
                    c.username ||
                    c.user?.name ||
                    "User"
                  )}
                </strong>

                <div>
                  ${escapeHTML(c.body || c.comment || c.text || "")}
                </div>

              </div>

            </div>

          `).join("")
          : `<div class="muted small">
              Hakuna comments bado.
             </div>`
        }
      </div>

      <div class="comment-form">

        <input
          id="commentInput-${id}"
          class="input"
          placeholder="Andika comment...">

        <button
          class="primary"
          onclick="sendComment('${id}')">
          ➤
        </button>

      </div>
    `;

  }catch(error){

    box.innerHTML =
      `<div class="muted small">
        ${escapeHTML(error.message)}
      </div>`;
  }
}


async function sendComment(id){

  const input = $(`commentInput-${id}`);

  if(!input) return;

  const body = input.value.trim();

  if(!body) return;

  try{

    await api(
      `/api/posts/${encodeURIComponent(id)}/comments`,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          body
        })
      }
    );

    input.value = "";

    loadComments(id);

  }catch(error){

    toast(error.message);
  }
}


async function reportPost(id){

  if(!confirm("Report this post?")) return;

  try{

    await api(
      `/api/posts/${encodeURIComponent(id)}/report`,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          reason:"User report"
        })
      }
    );

    toast("Post reported.");

  }catch(error){

    toast(error.message);
  }
}

   USERS / CHAT LIST
========================= */

async function searchUsers(value){

  const q = value.trim();

  const box = $("searchResults");

  if(q.length < 2){

    box.innerHTML = "";

    return;
  }

  try{

    const data = await api(
      `/api/users/search?q=${encodeURIComponent(q)}`
    );

    const users =
      Array.isArray(data)
      ? data
      : data.users || [];

    box.innerHTML =
      users.map(user=>`

        <div class="search-user">

          <img
            class="avatar small"
            src="${escapeHTML(
              avatarURL(
                user.avatar_url ||
                user.avatar
              )
            )}">

          <div>
            <strong>
              ${escapeHTML(
                user.name ||
                user.username ||
                "User"
              )}
            </strong>

            <div class="muted small">
              ${escapeHTML(
                user.username
                ? "@" + user.username
                : ""
              )}
            </div>
          </div>

          <button
            class="secondary"
            onclick='openChat(${JSON.stringify(user)})'>
            Chat
          </button>

        </div>

      `).join("");

  }catch(error){

    box.innerHTML =
      `<div class="muted small">
        ${escapeHTML(error.message)}
      </div>`;
  }
}


async function loadChats(){

  /*
    Backend V4 inaweza kurudisha chat list tofauti
    kulingana na implementation.
    Tunajaribu endpoint ya messages na fallback.
  */

  const box = $("chatItems");

  try{

    let data;

    try{

      data = await api("/api/messages");

    }catch(e){

      data = [];
    }

    const users =
      Array.isArray(data)
      ? data
      : data.chats ||
        data.users ||
        [];

    const unique = [];

    const seen = new Set();

    for(const item of users){

      const user =
        item.user ||
        item.other_user ||
        item;

      const id = user.id;

      if(!id || seen.has(String(id))) continue;

      if(ME && String(id) === String(ME.id)) continue;

      seen.add(String(id));

      unique.push(user);
    }

    if(!unique.length){

      box.innerHTML =
        `<div class="empty">
          Search user hapo juu kuanza chat.
        </div>`;

      return;
    }

    box.innerHTML =
      unique.map(user=>chatItemHTML(user)).join("");

  }catch(error){

    box.innerHTML =
      `<div class="empty">
        Search user kuanza chat.
      </div>`;
  }
}


function chatItemHTML(user){

  return `

  <div
    class="chat-item"
    onclick='openChat(${JSON.stringify(user)})'>

    <img
      class="avatar"
      src="${escapeHTML(
        avatarURL(
          user.avatar_url ||
          user.avatar
        )
      )}">

    <div class="chat-info">

      <strong>
        ${escapeHTML(
          user.name ||
          user.username ||
          "User"
        )}
      </strong>

      <small>
        ${escapeHTML(
          user.last_message ||
          "Start conversation"
        )}
      </small>

    </div>

  </div>

  `;
}


/* =========================
   OPEN CHAT
========================= */

async function openChat(user){

  if(!user || !user.id) return;

  currentChatUser = user;

  $("chatLayout").classList.add("chat-open");

  $("noChatSelected").classList.add("hidden");

  $("chatContent").classList.remove("hidden");

function closeChat(){

  $("chatContent").classList.add("hidden");

/* =========================
   MESSAGES
========================= */

async function loadChatMessages(){

  if(!currentChatUser) return;

  try{

    const data = await api(
      `/api/messages/${encodeURIComponent(currentChatUser.id)}`
    );

    currentMessages =
      Array.isArray(data)
      ? data
      : data.messages || [];

    renderMessages();

  }catch(error){

    $("messages").innerHTML =
      `<div class="empty">
        ${escapeHTML(error.message)}
      </div>`;
  }
}


function renderMessages(){

  const box = $("messages");

  if(!currentMessages.length){

    box.innerHTML =
      `<div class="empty">
        Anza mazungumzo hapa.
      </div>`;

    return;
  }

  box.innerHTML =
    currentMessages.map(message=>{

      const mine =
        String(message.sender_id) ===
        String(ME.id);

      const text =
        message.body ||
        message.text ||
        message.content ||
        "";

      const media =
        message.media_url ||
        message.file_url ||
        "";

      const isVoice =
        message.message_type === "voice" ||
        message.type === "voice" ||
        message.media_type === "audio";

      let content = "";

      if(isVoice && media){

        content = `
          <div class="voice-message">
            🎙️
            <audio
              controls
              src="${escapeHTML(fileURL(media))}">
            </audio>
          </div>
        `;

      }else if(media){

        content = `
          <a
            href="${escapeHTML(fileURL(media))}"
            target="_blank"
            rel="noopener">
            📎 Open attachment
          </a>
          ${
            text
            ? `<div style="margin-top:6px">
                ${escapeHTML(text)}
               </div>`
            : ""
          }
        `;

      }else{

        content =
          escapeHTML(text);
      }

      return `

        <div class="message ${mine ? "mine" : ""}">

          <div class="bubble">

            ${content}

            <span class="message-time">
              ${escapeHTML(
                message.created_at
                ? formatDate(message.created_at)
                : ""
              )}
            </span>

          </div>

        </div>
      `;

    }).join("");

  scrollMessages();
}


function scrollMessages(){

  const box = $("messages");

  setTimeout(()=>{
    box.scrollTop = box.scrollHeight;
  },50);
}


async function sendMessage(){

  if(!currentChatUser) return;

  const input = $("messageInput");

  const body = input.value.trim();

  if(!body) return;

  try{

    await api("/api/messages",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        receiver_id:currentChatUser.id,
        body
      })
    });

    input.value = "";

    await loadChatMessages();

    loadChats();

  }catch(error){

    toast(error.message);
  }
}

/* =========================
   VOICE NOTE
========================= */

async function toggleRecording(){

  if(mediaRecorder){

    stopRecording();

    return;
  }

  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getUserMedia){

    toast("Browser hii haiungi microphone.");

    return;
  }

  if(!currentChatUser){

    toast("Chagua chat kwanza.");

    return;
  }

  try{

    recordingStream =
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    recordingChunks = [];

    mediaRecorder =
      new MediaRecorder(recordingStream);

    mediaRecorder.ondataavailable = event=>{

      if(event.data.size > 0){
        recordingChunks.push(event.data);
      }
    };

    mediaRecorder.onstop = async()=>{

      const blob =
        new Blob(
          recordingChunks,
          {type:"audio/webm"}
        );

      const file =
        new File(
          [blob],
          "voice-note.webm",
          {type:"audio/webm"}
        );

      recordingStream
        ?.getTracks()
        .forEach(track=>track.stop());

      recordingStream = null;

      mediaRecorder = null;

      $("recordBtn").textContent = "🎙️";

      await uploadVoiceNote(file);
    };

    mediaRecorder.start();

    $("recordBtn").textContent = "⏹️";

    toast("Recording... bonyeza tena kumaliza.");

  }catch(error){

    toast(
      "Microphone permission haijaruhusiwa."
    );
  }
}


function stopRecording(){

  if(mediaRecorder){

    mediaRecorder.stop();
  }
}

function searchMessages(){

  $("chatMenu").classList.add("hidden");

  const q =
    prompt("Tafuta ujumbe:");

  if(!q || !currentMessages.length) return;

  const term = q.toLowerCase();

  const found =
    currentMessages.filter(m=>
      String(
        m.body ||
        m.text ||
        m.content ||
        ""
      ).toLowerCase().includes(term)
    );

  if(!found.length){

    toast("Ujumbe haujapatikana.");

    return;
  }

  const first = found[0];

  const index =
    currentMessages.indexOf(first);

  const elements =
    document.querySelectorAll(".message");

  if(elements[index]){

    elements[index].scrollIntoView({
      behavior:"smooth",
      block:"center"
    });
  }
}

/* =========================
   CALLS / LIVEKIT
========================= */

async function startCall(type){

  if(!currentChatUser){

    toast("Chagua contact kwanza.");

    return;
  }

  callType = type;
  callOtherUser = currentChatUser;

  $("callName").textContent =
    currentChatUser.name ||
    currentChatUser.username ||
    "User";

  $("callAvatar").src =
    avatarURL(
      currentChatUser.avatar_url ||
      currentChatUser.avatar
    );

  $("callCenterAvatar").src =
    $("callAvatar").src;

  $("callTypeText").textContent =
    type === "video"
    ? "Video call"
    : "Voice call";

  $("callStatus").textContent =
    "Calling...";

  $("callScreen").classList.remove("hidden");

  try{

    const data = await api("/api/calls/token",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        receiver_id:currentChatUser.id,
        call_type:type
      })
    });

    callId =
      data.call_id ||
      data.id;

    const token =
      data.token;

    const wsURL =
      data.livekit_url ||
      data.url ||
      data.server_url;

    if(!token || !wsURL){

      throw new Error(
        "LiveKit token/server URL haijapatikana."
      );
    }

    if(
      typeof LivekitClient === "undefined"
    ){

      throw new Error(
        "LiveKit browser SDK haijapakia."
      );
    }

    await connectLiveKit(
      wsURL,
      token,
      type
    );

  }catch(error){

    $("callStatus").textContent =
      error.message;

    toast(error.message);
  }
}


async function connectLiveKit(url,token,type){

  const LK = LivekitClient;

  callRoom =
    new LK.Room({
      adaptiveStream:true,
      dynacast:true
    });

  callRoom.on(
    LK.RoomEvent.TrackSubscribed,
    (track,publication,participant)=>{

      attachRemoteTrack(track);
    }
  );

  callRoom.on(
    LK.RoomEvent.TrackUnsubscribed,
    track=>{

      try{
        track.detach();
      }catch(e){}
    }
  );

  callRoom.on(
    LK.RoomEvent.ParticipantConnected,
    participant=>{

      $("callStatus").textContent =
        "Connected";

    }
  );

  callRoom.on(
    LK.RoomEvent.Disconnected,
    ()=>{

      $("callStatus").textContent =
        "Call ended";

      cleanupCall();
    }
  );

  await callRoom.connect(url,token);

  $("callStatus").textContent =
    "Connected";

  if(type === "video"){

    await enableCameraAndMic();

  }else{

    await enableMicOnly();
  }
}


async function enableMicOnly(){

  if(!callRoom) return;

  try{

    callMicTrack =
      await LivekitClient.createLocalAudioTrack();

    await callRoom.localParticipant.publishTrack(
      callMicTrack
    );

  }catch(error){

    toast(
      "Microphone haikupatikana."
    );
  }
}


async function enableCameraAndMic(){

  if(!callRoom) return;

  try{

    callMicTrack =
      await LivekitClient.createLocalAudioTrack();

    await callRoom.localParticipant.publishTrack(
      callMicTrack
    );

    callCameraTrack =
      await LivekitClient.createLocalVideoTrack();

    await callRoom.localParticipant.publishTrack(
      callCameraTrack
    );

    const videoElement =
      $("localVideo");

    const mediaStream =
      new MediaStream();

    if(callCameraTrack.mediaStreamTrack){
      mediaStream.addTrack(
        callCameraTrack.mediaStreamTrack
      );
    }

    if(callMicTrack.mediaStreamTrack){
      mediaStream.addTrack(
        callMicTrack.mediaStreamTrack
      );
    }

    videoElement.srcObject =
      mediaStream;

    $("localVideo").classList.remove("hidden");

  }catch(error){

    toast(
      "Camera/microphone haikupatikana."
    );
  }
}


function attachRemoteTrack(track){

  const element =
    track.attach();

  if(track.kind === "video"){

    const container =
      $("callVideos");

    element.className =
      "remote-video";

    container.insertBefore(
      element,
      container.firstChild
    );

  }else if(track.kind === "audio"){

    document.body.appendChild(element);
  }
}


async function toggleCallMute(){

  if(!callMicTrack) return;

  const enabled =
    callMicTrack.isEnabled;

  callMicTrack.enable(!enabled);

  $("muteCallBtn").textContent =
    enabled
    ? "🔇"
    : "🎙️";
}


async function toggleCallCamera(){

  if(!callCameraTrack) return;

  const enabled =
    callCameraTrack.isEnabled;

  callCameraTrack.enable(!enabled);

  $("cameraCallBtn").textContent =
    enabled
    ? "🚫"
    : "📷";
}


function switchCamera(){

  if(!callCameraTrack){

    toast("Camera haijawashwa.");

    return;
  }

  /*
    Browser/device camera switching differs.
    LiveKit camera source handling can be expanded
    when multiple camera devices are available.
  */

  toast("Camera switch requested.");
}


async function endCall(){

  try{

    if(callId){

      await api(
        `/api/calls/${encodeURIComponent(callId)}?status=ended`,
        {
          method:"PATCH"
        }
      );
    }

  }catch(e){}

  cleanupCall();
}


function cleanupCall(){

  try{

    if(callMicTrack){

      callMicTrack.stop();
      callMicTrack = null;
    }

    if(callCameraTrack){

      callCameraTrack.stop();
      callCameraTrack = null;
    }

    if(callRoom){

      callRoom.disconnect();
      callRoom = null;
    }

  }catch(e){}

  $("localVideo").srcObject = null;
  $("remoteVideo").srcObject = null;

  $("callScreen").classList.add("hidden");

  callId = null;
  callType = null;
  callOtherUser = null;
}

   STARTUP
========================= */

async function startup(){

  if(!TOKEN){

    $("authView").classList.remove("hidden");
    $("appView").classList.add("hidden");

    return;
  }

  try{

========================= */

startup();
