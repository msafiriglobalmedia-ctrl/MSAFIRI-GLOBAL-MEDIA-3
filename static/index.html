<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e27">
<title>MSAFIRI GLOBAL MEDIA</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splash">
  <div class="splash-logo">M</div>
  <h1>MSAFIRI GLOBAL MEDIA</h1>
  <p>Connect beyond — Media V0.0.1</p>
  <div class="splash-loader"><span></span><span></span><span></span></div>
</div>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="hidden">
  <div class="auth-box">
    <div class="auth-logo">M</div>
    <h1>MSAFIRI GLOBAL MEDIA</h1>
    <p class="muted">Connect beyond</p>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Login</button>
      <button class="auth-tab" data-tab="register">Register</button>
    </div>
    <form id="login-form" class="auth-form">
      <input type="text" id="login-username" placeholder="Username or Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit" class="btn-primary">Login</button>
    </form>
    <form id="register-form" class="auth-form hidden">
      <input type="text" id="reg-username" placeholder="Username" required>
      <input type="email" id="reg-email" placeholder="Email" required>
      <input type="text" id="reg-fullname" placeholder="Full Name" required>
      <input type="password" id="reg-password" placeholder="Password" required>
      <button type="submit" class="btn-primary">Create Account</button>
    </form>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">

  <!-- TOP BAR -->
  <header id="topbar">
    <div class="topbar-left">
      <button id="back-btn" class="icon-btn hidden">←</button>
      <span class="logo-sm">M</span>
      <span id="page-title">MSAFIRI</span>
    </div>
    <div class="topbar-right">
      <button id="dots-btn" class="icon-btn">⋮</button>
    </div>
  </header>

  <!-- DROPDOWN MENU -->
  <div id="dots-menu" class="dropdown hidden">
    <button data-action="manual">📖 User Manual</button>
    <button data-action="settings">⚙️ Settings</button>
    <button data-action="logout">🚪 Logout</button>
  </div>

  <!-- PAGES -->
  <main id="pages">

    <!-- HOME PAGE -->
    <section id="page-home" class="page active">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="🔍 Search people...">
      </div>
      <div class="feed-tabs">
        <button class="feed-tab active" data-feed="for-you">For You</button>
        <button class="feed-tab" data-feed="following">Following</button>
      </div>
      <div id="stories-bar" class="stories-bar">
        <div class="story-item add-story" id="add-story-btn">
          <div class="story-avatar add-avatar">+</div>
          <span>My Story</span>
        </div>
      </div>
      <div id="feed" class="feed"></div>
      <button id="fab-create" class="fab">+</button>
    </section>

    <!-- DISCOVERY PAGE -->
    <section id="page-discovery" class="page">
      <h2 class="page-h">Discovery</h2>
      <div class="discovery-grid" id="discovery-grid"></div>
    </section>

    <!-- CHATS PAGE -->
    <section id="page-chats" class="page">
      <h2 class="page-h">Chats</h2>
      <div id="chat-list" class="chat-list"></div>
    </section>

    <!-- PROFILE PAGE -->
    <section id="page-profile" class="page">
      <div class="profile-cover"></div>
      <div class="profile-info">
        <div class="profile-avatar" id="profile-avatar">M</div>
        <h2 id="profile-name">User</h2>
        <p id="profile-username" class="muted">@user</p>
        <p id="profile-bio" class="muted">Welcome to Msafiri</p>
        <div class="profile-stats">
          <div><strong id="stat-posts">0</strong><span>Posts</span></div>
          <div><strong id="stat-followers">0</strong><span>Followers</span></div>
          <div><strong id="stat-following">0</strong><span>Following</span></div>
        </div>
        <button id="edit-profile-btn" class="btn-secondary">Edit Profile</button>
      </div>
      <div id="profile-posts" class="feed"></div>
    </section>

    <!-- SUB PAGE (dynamic) -->
    <section id="page-sub" class="page">
      <div id="sub-content"></div>
    </section>

  </main>

  <!-- BOTTOM NAV -->
  <nav id="bottom-nav">
    <button class="nav-btn active" data-nav="home">
      <span class="nav-icon">🏠</span><span>Home</span>
    </button>
    <button class="nav-btn" data-nav="discovery">
      <span class="nav-icon">🧭</span><span>Discovery</span>
    </button>
    <button class="nav-btn" data-nav="chats">
      <span class="nav-icon">💬</span><span>Chats</span>
    </button>
    <button class="nav-btn" data-nav="profile">
      <span class="nav-icon">👤</span><span>Profile</span>
    </button>
  </nav>

</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <button id="modal-close" class="modal-close">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
